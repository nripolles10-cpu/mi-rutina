<script type="text/babel" data-presets="react">

/* =========================================================================
   SECCIÓN 1 · NATIVE (todo lo que depende del móvil)
   Busca "NATIVE-HOOK": son las únicas funciones que hay que sustituir para la APK.

const { useState, useEffect, useCallback, useMemo, useContext, createContext, useRef } = React;

/* =========================================================================
   NATIVE — TODO LO QUE DEPENDE DEL MÓVIL PASA POR AQUÍ
   Este objeto es lo ÚNICO que hay que sustituir para convertir la app en APK.
   Cada función tiene aquí una alternativa web y está marcada con // NATIVE-HOOK.
   El resto del código no toca localStorage (salvo el almacén de fotos), vibración, audio,
   descargas, enlaces, selector de fotos ni notificaciones: siempre llama a Native.
   ========================================================================= */

const STORAGE_KEY = 'gymtracker_nacho_v2';
const NATIVE_AVISO = 'Esta función solo está disponible en la app instalada en el móvil; en el navegador no hace nada.';

// Utilidad interna de Native: reduce una imagen a un máximo de px y la devuelve como dataURL JPEG
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
        else if (h >= w && h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Audio compartido: se "desbloquea" en un toque del usuario (los navegadores móviles no dejan sonar
// un AudioContext creado fuera de un gesto) y se reutiliza para el pitido del fin del descanso.
let SHARED_AUDIO = null;

const Native = {
  // Devuelve el estado guardado (objeto) o null si no hay NADA guardado.
  // Si hay algo guardado pero no se puede leer, LANZA un error con el texto original en err.raw,
  // para que el arranque lo rescate en vez de pisarlo con los datos de fábrica.
  loadState() { // NATIVE-HOOK
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { const err = new Error('almacenamiento no accesible'); err.raw = null; err.inaccesible = true; throw err; }
    if (raw === null || raw === undefined || raw === '') return null;
    try { return JSON.parse(raw); } catch (e) { const err = new Error('datos guardados ilegibles'); err.raw = raw; throw err; }
  },

  // Guarda el estado principal (sin fotos). Devuelve true si se guardó.
  saveState(obj) { // NATIVE-HOOK
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; }
  },

  // Vibra durante ms milisegundos. Devuelve true si el dispositivo lo permite.
  vibrate(ms) { // NATIVE-HOOK
    try { if (navigator.vibrate) { navigator.vibrate(ms || 200); return true; } } catch (e) { /* sin vibración */ }
    return false;
  },

  // Prepara el audio dentro de un toque del usuario (al empezar el descanso) para que el pitido final suene.
  unlockAudio() { // NATIVE-HOOK
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      if (!SHARED_AUDIO) SHARED_AUDIO = new AC();
      if (SHARED_AUDIO.state === 'suspended' && SHARED_AUDIO.resume) SHARED_AUDIO.resume().catch(() => {});
      return true;
    } catch (e) { return false; }
  },

  // Pitido corto (Web Audio). Devuelve true si se ha intentado sonar.
  beep() { // NATIVE-HOOK
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const shared = SHARED_AUDIO && SHARED_AUDIO.state !== 'closed';
      const ctx = shared ? SHARED_AUDIO : new AC();
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(() => {});
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.4);
      if (!shared) setTimeout(() => { try { ctx.close(); } catch (e) { /* ya cerrado */ } }, 600);
      return true;
    } catch (e) { return false; }
  },

  // Comparte texto o un archivo: { title, text, filename, mime }. Sin compartir nativo, descarga el contenido.
  share(o) { // NATIVE-HOOK
    const opts = o || {};
    try {
      if (navigator.share && !opts.filename) {
        const p = navigator.share({ title: opts.title || '', text: opts.text || '' });
        if (p && p.catch) p.catch(() => { /* el usuario canceló o el sistema no pudo compartir */ });
        return true;
      }
    } catch (e) { /* seguimos con la descarga */ }
    return Native.saveFile(opts.filename || 'compartir.txt', opts.text || '', opts.mime || 'text/plain;charset=utf-8');
  },

  // Guarda un archivo (descarga por Blob en el navegador). Devuelve true si se lanzó la descarga.
  saveFile(filename, content, mime) { // NATIVE-HOOK
    try {
      const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
      return true;
    } catch (e) { return false; }
  },

  // Abre un enlace fuera de la app. Solo http/https (un código importado no puede colar "javascript:" u otros esquemas).
  openUrl(url) { // NATIVE-HOOK
    const u = safeUrl(url);
    if (!u) return false;
    try { window.open(u, '_blank', 'noopener'); return true; } catch (e) { return false; }
  },

  // Abre el selector de fotos (input file SIN capture) y devuelve una promesa con la foto comprimida
  // (~500 px, calidad 0,65) como dataURL, o null si se cancela o falla.
  pickPhoto() { // NATIVE-HOOK
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none';
      document.body.appendChild(input);
      const done = (v) => { if (input.parentNode) input.parentNode.removeChild(input); resolve(v); };
      input.addEventListener('change', () => {
        const f = input.files && input.files[0];
        if (!f) { done(null); return; }
        compressImage(f, 500, 0.65).then(done, () => done(null));
      });
      input.addEventListener('cancel', () => done(null));
      input.click();
    });
  },

  // Programa un aviso: { id, title, body, at } (at = fecha en ms). En el navegador no hace nada.
  scheduleNotification(o) { // NATIVE-HOOK
    try { console.info('Native.scheduleNotification: ' + NATIVE_AVISO); } catch (e) { /* sin consola */ }
    return { ok: false, aviso: NATIVE_AVISO };
  },

  // Cancela un aviso programado. En el navegador no hace nada.
  cancelNotification(id) { // NATIVE-HOOK
    try { console.info('Native.cancelNotification: ' + NATIVE_AVISO); } catch (e) { /* sin consola */ }
    return { ok: false, aviso: NATIVE_AVISO };
  },

  // Mantiene (true) o deja de mantener (false) la pantalla encendida. En el navegador no hace nada.
  keepAwake(on) { // NATIVE-HOOK
    try { console.info('Native.keepAwake: ' + NATIVE_AVISO); } catch (e) { /* sin consola */ }
    return { ok: false, aviso: NATIVE_AVISO };
  },
};
window.Native = Native;

// Macros de un ingrediente concreto (cantidad q en la unidad u). cda = 15 ml, cdta = 5 ml.
function ingMacros(n, q, u) {
  const d = NUTRI_DB[n];
  if (!d || q === null || q === undefined || q === '') return [0, 0, 0];
  let f = null;
  if (d.per100 && (u === 'g' || u === 'ml')) f = q / 100;
  else if (d.per100 && u === 'cda') f = (q * 15) / 100;
  else if (d.per100 && u === 'cdta') f = (q * 5) / 100;
  const base = f !== null ? d.per100 : d.ud;
  if (!base) return [0, 0, 0];
  const k = f !== null ? f : q;
  return [base[0] * k, base[1] * k, base[2] * k];
}

/* =========================================================================
   SECCIÓN 3 · UTILIDADES
   Funciones puras: formato, series, marcas, series por semana, objetivos por músculo, salud, nutrición y comida.

/* =========================================================================
   UTILIDADES
   ========================================================================= */

function uid() { return Math.random().toString(36).slice(2, 10); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function nz(v) { return v === undefined || v === null ? null : v; }
function num(v) { return typeof v === 'number' && !isNaN(v) ? v : 0; }
function numOrNull(v) { return typeof v === 'number' && !isNaN(v) ? v : null; }
function pad2(n) { return String(n).padStart(2, '0'); }
// Fecha local en formato AAAA-MM-DD (sirve de clave para diario, agua, sueño…)
function ymd(d) {
  const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate());
}
function fromYmd(k) { const p = String(k).split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function fmt(n, d) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-ES', { maximumFractionDigits: d === undefined ? 1 : d });
}
function fmtDateShort(iso) {
  try { return new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }); } catch (e) { return ''; }
}
function fmtDateLong(iso) {
  try { return new Date(iso).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return ''; }
}
// Primer número que aparece en un texto ("115 kg + minis" -> 115). Si no hay, null.
function parseNum(text) {
  if (text === null || text === undefined) return null;
  const m = String(text).replace(',', '.').match(/\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
// N\u00famero escrito por el usuario: admite coma o punto decimal ("102,5" = "102.5").
// Devuelve null si est\u00e1 vac\u00edo, el n\u00famero si es v\u00e1lido y undefined si todav\u00eda no es un n\u00famero (por ejemplo "," o "7,x").
function parseDecimal(text) {
  const t = String(text === null || text === undefined ? '' : text).trim().replace(/\s/g, '');
  if (t === '') return null;
  if (!/^\d*([.,]\d*)?$/.test(t) || t === '.' || t === ',') return undefined;
  const v = parseFloat(t.replace(',', '.'));
  return isFinite(v) ? v : undefined;
}
// N\u00famero para mostrar dentro de un campo: con coma decimal y sin separador de miles ("102,5", "1500")
function formatDecimal(v) {
  if (v === null || v === undefined || typeof v !== 'number' || !isFinite(v)) return '';
  return String(Math.round(v * 1000) / 1000).replace('.', ',');
}
// Enlace seguro: solo http/https. Devuelve el enlace o null.
function safeUrl(u) {
  const s = String(u || '').trim();
  return /^https?:\/\/[^\s]+$/i.test(s) ? s : null;
}
function stripAcc(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function mean(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0; }
/* =========================================================================
   FOTOS: se guardan en una clave aparte de localStorage (NO dentro del estado principal).
   Elegir la foto pasa por Native.pickPhoto(); aquí solo se guarda el resultado.
   ========================================================================= */

const FOTOS_KEY = 'gymtracker_fotos_v1';
function loadFotos() { try { const r = localStorage.getItem(FOTOS_KEY); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } }
function saveFotos(m) { try { localStorage.setItem(FOTOS_KEY, JSON.stringify(m)); return true; } catch (e) { return false; } }

/* =========================================================================
   SERIES: tipos y estructura
   ========================================================================= */

// Garantiza que la serie tenga los datos que necesita su tipo (tandas para rest-pause, descensos para dropset)
// y mantiene reps/peso "principales" sincronizados (los usan el progreso y las marcas).
function ensureStruct(s) {
  const out = { ...s };
  if (out.tipo === 'rp') {
    if (!Array.isArray(out.tandas) || out.tandas.length < 2) {
      const m = String(out.nota || '').toLowerCase().match(/(\d+)\s*tandas/);
      const n = Math.min(8, Math.max(2, m ? parseInt(m[1], 10) : 3));
      const t = [nz(out.reps)];
      for (let i = 1; i < n; i++) t.push(null);
      out.tandas = t;
    }
    out.reps = nz(out.tandas[0]);
  }
  if (out.tipo === 'drop') {
    if (!Array.isArray(out.drops) || out.drops.length < 2) {
      out.drops = [{ weight: nz(out.weight), reps: nz(out.reps) }, { weight: null, reps: null }];
    }
    out.weight = nz(out.drops[0].weight);
    out.reps = nz(out.drops[0].reps);
  }
  return out;
}

function normalizeSet(s, idx) {
  const src = s || {};
  const nota = src.nota ? String(src.nota) : null;
  let tipo = SET_TYPES[src.tipo] ? src.tipo : null;
  if (!tipo) {
    const low = (nota || '').toLowerCase();
    if (/calentamiento/.test(low)) tipo = 'warm';
    else if (/rest[\s-]?pause/.test(low)) tipo = 'rp';
    else if (/drop\s?set/.test(low)) tipo = 'drop';
    else tipo = idx === 0 ? 'top' : 'backoff';
  }
  const base = { reps: nz(src.reps), weight: nz(src.weight), nota: nota, tipo: tipo };
  if (Array.isArray(src.tandas)) base.tandas = src.tandas.map(numOrNull);
  if (Array.isArray(src.drops)) base.drops = src.drops.map((d) => ({ weight: numOrNull(d && d.weight), reps: numOrNull(d && d.reps) }));
  return ensureStruct(base);
}

// Series efectivas que cuenta una serie: calentamiento no cuenta; en rest-pause y dropset
// cada tanda / descenso extra suma media serie.
function effectiveCount(set) {
  if (!set || set.tipo === 'warm') return 0;
  let n = 1;
  if (set.tipo === 'rp') n += 0.5 * Math.max(0, (set.tandas || []).length - 1);
  if (set.tipo === 'drop') n += 0.5 * Math.max(0, (set.drops || []).length - 1);
  return n;
}

// Volumen (kg totales levantados) de una serie. El calentamiento no cuenta.
/* =========================================================================
   MARCAS, VOLUMEN SEMANAL Y OBJETIVOS POR MÚSCULO
   ========================================================================= */

function computeScore(set) {
  if (!set) return 0;
  const w = typeof set.weight === 'number' ? set.weight : 0;
  const r = typeof set.reps === 'number' ? set.reps : 1;
  return w > 0 ? w * r : 0;
}
function bestSerie1(ex) {
  const hist = ex.history || [];
  let best = null;
  hist.forEach((h) => {
    const w = h.sets && h.sets[0] ? h.sets[0].weight : null;
    if (typeof w === 'number' && (best === null || w > best)) best = w;
  });
  if (best === null && ex.currentSets && ex.currentSets[0]) best = ex.currentSets[0].weight;
  return typeof best === 'number' ? best : null;
}
function latestSerie1(ex) {
  const hist = ex.history || [];
  if (hist.length) {
    const w = hist[hist.length - 1].sets && hist[hist.length - 1].sets[0] ? hist[hist.length - 1].sets[0].weight : null;
    if (typeof w === 'number') return w;
  }
  return ex.currentSets && ex.currentSets[0] && typeof ex.currentSets[0].weight === 'number' ? ex.currentSets[0].weight : null;
}

// Solo cuentan los ejercicios que están en algún día
function activeExerciseIds(state) {
  const set = new Set();
  (state.days || []).forEach((d) => (d.ids || []).forEach((id) => { if (state.exercises[id]) set.add(id); }));
  return Array.from(set);
}

// Series efectivas semanales por músculo. Cada ejercicio cuenta SOLO para el músculo que le asignas.
// Un ejercicio compartido entre dos días (como el gemelo) cuenta en cada día en que aparece.
function weeklySets(state) {
  const totals = {};
  CAT_IDS.forEach((k) => { totals[k] = 0; });
  (state.days || []).forEach((day) => {
    (day.ids || []).forEach((id) => {
      const ex = state.exercises[id];
      if (!ex) return;
      totals[ex.cat] = (totals[ex.cat] || 0) + (ex.currentSets || []).reduce((acc, s) => acc + effectiveCount(s), 0);
    });
  });
  return totals;
}

// Progreso hacia los objetivos de levantamiento por músculo: media de (mejor marca / objetivo) limitada a 100 %
// y kg que faltan de media. Se ignoran los ejercicios sin objetivo numérico.
function muscleProgress(state) {
  const out = {};
  CAT_IDS.forEach((k) => { out[k] = { items: [], pct: null, falta: null, ignorados: 0 }; });
  activeExerciseIds(state).forEach((id) => {
    const ex = state.exercises[id];
    const o = out[ex.cat];
    const val = ex.objetivo && typeof ex.objetivo.value === 'number' && ex.objetivo.value > 0 ? ex.objetivo.value : null;
    const best = bestSerie1(ex);
    if (val === null || best === null) { o.ignorados += 1; return; }
    o.items.push({ id, name: ex.name, best, objetivo: val, pct: Math.min(1, best / val), falta: Math.max(0, val - best) });
  });
  CAT_IDS.forEach((k) => {
    const o = out[k];
    if (o.items.length) { o.pct = mean(o.items.map((i) => i.pct)) * 100; o.falta = mean(o.items.map((i) => i.falta)); }
  });
  return out;
}

/* =========================================================================
   SALUD Y NUTRICIÓN
   ========================================================================= */

function calcBMI(kg, cm) { if (!kg || !cm) return null; const m = cm / 100; return kg / (m * m); }
function bmiCategory(bmi) {
  if (bmi === null) return null;
  if (bmi < 18.5) return { label: 'Bajo peso', color: '#38BDF8' };
  if (bmi < 25) return { label: 'Normal', color: '#22C55E' };
  if (bmi < 30) return { label: 'Sobrepeso', color: '#F5A524' };
  return { label: 'Obesidad', color: '#F43F5E' };
}
// Metabolismo basal: Katch-McArdle si hay % de grasa (mejor para gente musculada); si no, Mifflin-St Jeor.
function calcBMRInfo(o) {
  if (!o.kg) return null;
  if (o.grasaPct && o.grasaPct >= 4 && o.grasaPct <= 60) {
    const lbm = o.kg * (1 - o.grasaPct / 100);
    return { bmr: 370 + 21.6 * lbm, metodo: 'Katch-McArdle' };
  }
  if (!o.cm || !o.edad || !o.sexo) return null;
  const base = 10 * o.kg + 6.25 * o.cm - 5 * o.edad;
  return { bmr: o.sexo === 'M' ? base + 5 : base - 161, metodo: 'Mifflin-St Jeor' };
}
function calcCalorias(form) {
  const info = calcBMRInfo({ kg: form.pesoInicialKg, cm: form.alturaCm, edad: form.edad, sexo: form.sexo, grasaPct: form.grasaPct });
  if (info === null) return null;
  const tdee = info.bmr * (ACTIVIDAD_FACTOR[form.actividad] || 1.5);
  return { mantener: Math.round(tdee), subir: Math.round(tdee + 300), bajar: Math.round(tdee - 400), metodo: info.metodo };
}
// Estimación de grasa corporal (fórmula de Deurenberg) — orientativa, no clínica.
function estimaGrasaCorporal(form) {
  const bmi = calcBMI(form.pesoInicialKg, form.alturaCm);
  if (bmi === null || !form.edad || !form.sexo) return null;
  const bf = 1.2 * bmi + 0.23 * form.edad - 10.8 * (form.sexo === 'M' ? 1 : 0) - 5.4;
  return Math.max(3, Math.round(bf * 10) / 10);
}

// Macros: proteína y grasa por kg de peso (rangos 2,0–2,3 y 0,7–0,8) y los hidratos con el resto de las calorías.
function macroSplit(kcal, kg, protF, fatF) {
  const protG = Math.round(protF * kg);
  const fatG = Math.round(fatF * kg);
  const restante = kcal - protG * 4 - fatG * 9;
  const carbG = Math.max(0, Math.round(restante / 4));
  return { protG, fatG, carbG, protKcal: protG * 4, fatKcal: fatG * 9, carbKcal: carbG * 4, protF, fatF, carbBajo: restante < 0 };
}

function calcPlan(o) {
  const obj = OBJETIVOS[o.objetivo] || OBJETIVOS.definicion;
  const info = calcBMRInfo({ kg: o.kg, cm: o.alturaCm, edad: o.edad, sexo: o.sexo, grasaPct: o.grasaPct });
  if (info === null) return { falta: true };
  const tdeeEst = Math.round(info.bmr * (ACTIVIDAD_FACTOR[o.actividad] || 1.5));
  const tdee = o.tdeeReal ? Math.round(o.tdeeReal) : tdeeEst;
  const r = RITMOS[o.ritmo] || RITMOS.normal;
  const delta = o.objetivo === 'volumen' ? r.vol : o.objetivo === 'definicion' ? -r.def : 0;
  const kcal = Math.max(0, tdee + delta);
  const split = macroSplit(kcal, o.kg, obj.protF, obj.fatF);
  const semanal = (delta * 7) / 7700; // kg/semana aprox.
  let semanas = null;
  if (o.objetivo !== 'mantenimiento' && o.objetivoKg && delta !== 0) {
    const diff = o.objetivoKg - o.kg;
    if (diff * delta > 0) semanas = Math.ceil(Math.abs(diff / semanal));
  }
  return { falta: false, bmr: Math.round(info.bmr), metodo: info.metodo, tdeeEst, tdee, delta, kcal, semanal, semanas, ...split };
}

function pick(a, b) { return a === null || a === undefined ? b : a; }

// Valores efectivos de la calculadora: lo que escribes ahí o, si lo dejas vacío, tus datos de Ajustes / peso registrado
function effNutri(state) {
  const n = state.nutricion;
  const f = state.formulario;
  const hist = state.peso.historial || [];
  const pesoReg = hist.length ? hist[hist.length - 1].kg : f.pesoInicialKg;
  const eff = {
    kg: pick(n.pesoActual, pesoReg),
    objetivoKg: pick(n.pesoObjetivo, state.peso.objetivoKg),
    edad: pick(n.edad, f.edad),
    alturaCm: pick(n.alturaCm, f.alturaCm),
    sexo: n.sexo || f.sexo || 'M',
    actividad: n.actividad || f.actividad || 'intenso',
    grasaPct: pick(n.grasaPct, f.grasaPct),
  };
  const plan = eff.kg ? calcPlan({ objetivo: n.objetivo, ritmo: n.ritmo, ...eff, tdeeReal: n.tdeeReal }) : { falta: true };
  return { n, eff, plan, obj: OBJETIVOS[n.objetivo] || OBJETIVOS.definicion };
}

/* ---------- Comida, copiado y exportación ---------- */

// Mensaje de éxito en el estilo normal y de fallo en amarillo
function toastResult(showToast, ok, okMsg, failMsg) { showToast(ok ? okMsg : failMsg, ok ? undefined : 'warn'); return ok; }

function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) { return false; }
}

function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      // La API moderna es asíncrona: si falla (permiso denegado, WebView antigua) se intenta el método clásico
      navigator.clipboard.writeText(text).catch(() => { legacyCopy(text); });
      return true;
    }
  } catch (e) { /* seguimos con el método antiguo */ }
  return legacyCopy(text);
}


function describeSet(s) {
  if (!s) return '';
  const t = (SET_TYPES[s.tipo] || SET_TYPES.top).label;
  if (s.tipo === 'rp') return t + ' ' + fmt(s.weight) + ' kg · ' + (s.tandas || []).map((r) => (r === null ? '–' : r)).join('/') + ' reps';
  if (s.tipo === 'drop') return t + ' ' + (s.drops || []).map((d) => (d.reps === null ? '–' : d.reps) + '×' + (d.weight === null ? '–' : fmt(d.weight))).join(' → ') + ' kg';
  return t + ' ' + (s.reps === null ? '–' : s.reps) + '×' + (s.weight === null ? 'sin peso' : fmt(s.weight) + ' kg');
}

function escHtml(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function kcalOfMacros(p, c, g) { return Math.round(4 * num(p) + 4 * num(c) + 9 * num(g)); }

function entryTotals(list) {
  return (list || []).reduce((a, e) => ({ kcal: a.kcal + num(e.kcal), p: a.p + num(e.p), c: a.c + num(e.c), g: a.g + num(e.g) }), { kcal: 0, p: 0, c: 0, g: 0 });
}

function gastoReal(state) {
  const diario = state.comida.diario || {};
  const hoy = ymd(new Date());
  const desde = ymd(addDays(new Date(), -35));
  const dias = Object.keys(diario).filter((k) => k >= desde && k <= hoy && entryTotals(diario[k]).kcal > 0).sort();
  if (dias.length < 14) return { ok: false, motivo: 'Faltan días de comidas: llevas ' + dias.length + ' de 14 (solo cuentan los días con comidas apuntadas en los últimos 35).' };
  const kcalMed = mean(dias.map((k) => entryTotals(diario[k]).kcal));
  const w = (state.peso.historial || []).map((r) => ({ t: new Date(r.date).getTime() / 86400000, kg: r.kg }))
    .filter((r) => r.t >= fromYmd(dias[0]).getTime() / 86400000 - 1 && r.t <= fromYmd(dias[dias.length - 1]).getTime() / 86400000 + 1).sort((a, b) => a.t - b.t);
  if (w.length < 2) return { ok: false, motivo: 'Faltan pesos: necesito al menos 2 registros de peso dentro del periodo de tus comidas.' };
  const span = w[w.length - 1].t - w[0].t;
  if (span < 14) return { ok: false, motivo: 'Tus pesos cubren ' + Math.round(span) + ' días; necesito 14 o más entre el primero y el último.' };
  const tm = mean(w.map((r) => r.t)), km = mean(w.map((r) => r.kg));
  let sxy = 0, sxx = 0;
  w.forEach((r) => { sxy += (r.t - tm) * (r.kg - km); sxx += (r.t - tm) * (r.t - tm); });
  const kgDia = sxx ? sxy / sxx : 0;
  const tdee = kcalMed - kgDia * 7700;
  return { ok: true, kcalMed: Math.round(kcalMed), kgSemana: kgDia * 7, tdee: Math.round(tdee), dias: dias.length, span: Math.round(span) };
}

function setVolume(s) {
  if (!s || s.tipo === 'warm') return 0;
  if (s.tipo === 'rp') return num(s.weight) * (s.tandas || []).reduce((a, r) => a + num(r), 0);
  if (s.tipo === 'drop') return (s.drops || []).reduce((a, d) => a + num(d && d.weight) * num(d && d.reps), 0);
  return num(s.weight) * num(s.reps);
}

function setsVolume(sets) { return (sets || []).reduce((a, s) => a + setVolume(s), 0); }

function defaultComida() { return { recetas: mkRecetas(), favoritos: [], diario: {}, plan: {}, compra: {}, agua: { objetivo: 3, dias: {}, unidad: 'litros' } }; }

// El agua se cuenta en litros (1 botella = 1 L). Los datos guardados antes en vasos (de 250 ml) se convierten solos.
function normalizeAgua(a) {
  if (!a) return { objetivo: 3, dias: {}, unidad: 'litros' };
  if (a.unidad === 'litros') return { objetivo: a.objetivo || 3, dias: a.dias || {}, unidad: 'litros' };
  const dias = {};
  Object.keys(a.dias || {}).forEach((k) => { dias[k] = Math.round((a.dias[k] || 0) * 0.25 * 100) / 100; });
  return { objetivo: Math.round((a.objetivo || 12) * 0.25 * 2) / 2 || 3, dias: dias, unidad: 'litros' };
}

function normalizeRecetas(list, seed) {
  const arr = Array.isArray(list) ? list : seed;
  return arr.filter((r) => r && typeof r === 'object').map((r) => ({
    id: r.id || 'r_' + uid(), nombre: r.nombre || 'Receta',
    tipo: ['desayuno', 'comida', 'cena', 'snack'].indexOf(r.tipo) !== -1 ? r.tipo : 'comida',
    objetivos: Array.isArray(r.objetivos) ? r.objetivos.filter((o) => OBJETIVOS[o]) : [], p: num(r.p), c: num(r.c), g: num(r.g),
    ingredientes: Array.isArray(r.ingredientes) ? r.ingredientes.filter((x) => x && typeof x === 'object').map((x) => ({ n: String(x.n || ''), q: numOrNull(x.q), u: String(x.u || '') })) : [],
    pasos: Array.isArray(r.pasos) ? r.pasos.map(String) : [], propia: !!r.propia, editada: !!r.editada,
  }));
}

// Macros de una lista de ingredientes con NUTRI_DB. desconocidos = ingredientes que no están en la tabla.
function macrosFromIngredientes(ingredientes) {
  let p = 0, c = 0, g = 0;
  const desconocidos = [];
  (ingredientes || []).forEach((x) => {
    if (!x || !String(x.n || '').trim()) return;
    if (!NUTRI_DB[x.n]) { desconocidos.push(x.n); return; }
    const m = ingMacros(x.n, x.q, x.u);
    p += m[0]; c += m[1]; g += m[2];
  });
  return { p: Math.round(p), c: Math.round(c), g: Math.round(g), desconocidos };
}

function normalizeExercise(ex) {
  const rawSets = Array.isArray(ex.currentSets) ? ex.currentSets : Array.isArray(ex.sets) ? ex.sets : [];
  const sets = rawSets.map((s, i) => normalizeSet(s, i));
  const out = {
    ...ex,
    name: typeof ex.name === 'string' && ex.name ? ex.name : 'Ejercicio',
    cat: CATS[ex.cat] ? ex.cat : 'core',
    altName: ex.altName || null,
    objetivo: ex.objetivo || null,
    marcaAntigua: ex.marcaAntigua || null,
    comentario: typeof ex.comentario === 'string' ? ex.comentario : (ex.tags || []).join(' · '),
    currentSets: sets.length ? sets : [normalizeSet({}, 0)],
    history: Array.isArray(ex.history) ? ex.history : [],
  };
  delete out.sets; delete out.tags; delete out.photo; delete out.rotacionCon;
  return out;
}

function normalizeDay(d) {
  const ids = Array.isArray(d.ids) ? d.ids.filter((x, i, a) => typeof x === 'string' && a.indexOf(x) === i) : [];
  return { ...d, id: d.id || 'day_' + uid(), label: d.label || 'Día', equipo: d.equipo || '', nota: d.nota || '', ids: ids };
}

function buildInitialState() {
  const exercises = {};
  Object.keys(SEED_EXERCISES).forEach((id) => {
    const ex = SEED_EXERCISES[id];
    const seedSets = ex.sets.map((s, i) => normalizeSet(s, i));
    exercises[id] = normalizeExercise({
      name: ex.name, cat: ex.cat, comentario: ex.comentario || '', objetivo: ex.objetivo ? clone(ex.objetivo) : null,
      currentSets: seedSets, history: [{ date: new Date().toISOString(), sets: clone(seedSets), seed: true }],
    });
  });
  return {
    version: APP_VERSION,
    exercises,
    days: clone(DAYS_SEED).map(normalizeDay),
    diana: { estados: {}, titulos: {} },
    cardio: CARDIO.map((c) => ({ ...c })),
    formulario: { nombre: '', edad: null, sexo: 'M', alturaCm: null, pesoInicialKg: 84, actividad: 'intenso', grasaPct: null, objetivoPesoKg: 80, objetivoPasosDiarios: 10000 },
    peso: { historial: [{ id: uid(), date: new Date().toISOString(), kg: 84 }], objetivoKg: 80, direccion: 'bajar', objetivoAlcanzado: false },
    extras: {
      movilidad: { titulo: 'Rutina de movilidad matutina', url: 'https://www.youtube.com/watch?v=Pnbwyxh4LJs&t=160s' },
      suplementos: [
        { id: 'creatina', nombre: 'Creatina', nota: 'Tomar durante un tiempo (3 meses) y luego descansar 2 semanas – 1 mes.', filas: [
          { id: 'a', label: 'Lo recomendable', value: '3 g (1 scoop)', destacado: false },
          { id: 'b', label: 'Lo normal', value: 'Entre 3–6 g', destacado: true },
          { id: 'c', label: 'Fase de carga (1ª semana)', value: '2 scoops / día', destacado: false },
          { id: 'd', label: 'Más avanzado (0,07 × tu peso, 80–85kg)', value: '6 g (2 scoops)', destacado: false },
        ] },
        { id: 'proteina', nombre: 'Proteína', nota: '', filas: [{ id: 'a', label: 'Dosis', value: '30 g (1 scoop)', destacado: false }] },
        { id: 'multi', nombre: 'Multivitamínico', nota: '', filas: [{ id: 'a', label: 'Dosis', value: '1 pastilla al día', destacado: false }] },
        { id: 'omega3', nombre: 'Omega 3', nota: '', filas: [{ id: 'a', label: 'Dosis', value: '1 pastilla al día', destacado: false }] },
        { id: 'magnesio', nombre: 'Magnesio', nota: '', filas: [{ id: 'a', label: 'Dosis', value: '1 pastilla al día', destacado: false }] },
      ],
    },
    nutricion: { objetivo: 'definicion', ritmo: 'normal', pesoActual: null, pesoObjetivo: null, edad: null, alturaCm: null, sexo: null, actividad: null, grasaPct: null, tdeeReal: null },
    comida: defaultComida(),
    meta: { activeTab: 'rutina', activeDay: 'piernaA', editMode: false },
  };
}

const TAB_IDS = ['rutina', 'cardio', 'progreso', 'fisico', 'comida', 'extras'];

// Normaliza un estado ya migrado a la versión actual: se combina con la semilla para que un campo nuevo
// nunca borre lo que tenías. NO cambia la rutina del usuario: solo rellena lo que falta y repara lo roto.
function normalizeCurrent(loaded, seed) {
  const lv = Number(loaded.version);
  const next = { ...seed, ...loaded, version: isFinite(lv) && lv > APP_VERSION ? lv : APP_VERSION };
  const rawEx = loaded.exercises && typeof loaded.exercises === 'object' ? loaded.exercises : seed.exercises;
  const exercises = {};
  Object.keys(rawEx).forEach((id) => { if (rawEx[id] && typeof rawEx[id] === 'object') exercises[id] = normalizeExercise(rawEx[id]); });
  const rawDays = Array.isArray(loaded.days) ? loaded.days : seed.days;
  const days = rawDays.filter((d) => d && typeof d === 'object').map(normalizeDay);
  // Un día que apunta a un ejercicio que no existe: se recupera de la semilla si está ahí; si no, se quita la referencia rota.
  days.forEach((d) => {
    d.ids.forEach((id) => { if (!exercises[id] && seed.exercises[id]) exercises[id] = seed.exercises[id]; });
    d.ids = d.ids.filter((id) => !!exercises[id]);
  });
  next.exercises = exercises;
  next.days = days;
  next.diana = { estados: {}, titulos: {}, ...(loaded.diana || {}) };
  next.formulario = { ...seed.formulario, ...(loaded.formulario || {}) };
  const peso = { ...seed.peso, ...(loaded.peso || {}) };
  peso.historial = (Array.isArray(peso.historial) ? peso.historial : [])
    .filter((r) => r && typeof r === 'object' && typeof r.kg === 'number' && isFinite(r.kg) && !isNaN(new Date(r.date).getTime()))
    .map((r) => ({ ...r, id: r.id || uid() }));
  next.peso = peso;
  next.cardio = Array.isArray(loaded.cardio) ? loaded.cardio.filter((c) => c && typeof c === 'object').map((c) => ({ ...c, id: c.id || 'cardio_' + uid() })) : seed.cardio;
  const ex = loaded.extras || {};
  next.extras = {
    movilidad: { ...seed.extras.movilidad, ...(ex.movilidad || {}) },
    suplementos: Array.isArray(ex.suplementos) ? ex.suplementos.filter((s) => s && typeof s === 'object').map((s) => ({ ...s, id: s.id || 'sup_' + uid(), filas: Array.isArray(s.filas) ? s.filas : [] })) : seed.extras.suplementos,
  };
  next.nutricion = { ...seed.nutricion, ...(loaded.nutricion || {}) };
  const c = loaded.comida || {};
  next.comida = {
    recetas: normalizeRecetas(c.recetas, seed.comida.recetas),
    favoritos: Array.isArray(c.favoritos) ? c.favoritos : [],
    diario: c.diario && typeof c.diario === 'object' ? c.diario : {},
    plan: c.plan && typeof c.plan === 'object' ? c.plan : {},
    compra: c.compra && typeof c.compra === 'object' ? c.compra : {},
    agua: normalizeAgua(c.agua),
  };
  next.meta = { ...seed.meta, ...(loaded.meta || {}) };
  if (TAB_IDS.indexOf(next.meta.activeTab) === -1) next.meta.activeTab = 'rutina';
  if (!days.some((d) => d.id === next.meta.activeDay)) next.meta.activeDay = days.length ? days[0].id : null;
  delete next.profile; delete next.pasos;
  return next;
}

// Datos de la APP ANTIGUA (sin campo version o con version 5 o menor): se pone la rutina nueva,
// pero se conservan peso, ajustes, cardio, suplementos, nutrición, comida y el HISTORIAL de los ejercicios
// que se llaman igual. Los ejercicios antiguos que no existen en la rutina nueva se guardan ocultos
// (con su historial) para no perder nada. Las fotos antiguas se pasan a su almacén aparte.
let PENDING_PHOTOS = null;
// Grupos antiguos → músculos separados: los aductores salían dentro de cuádriceps; hip thrust y abducción dentro de isquios.
function fixLegacyCat(e) {
  const name = stripAcc(e.name || '').toLowerCase();
  if (e.cat === 'cuadriceps' && /aductor/.test(name)) return 'aductores';
  if (e.cat === 'isquios' && /hip\s*thrust|abduccion/.test(name)) return 'gluteo';
  return e.cat;
}
function upgradeLegacy(loaded, seed) {
  const key = (s) => stripAcc(String(s || '').trim().toLowerCase());
  const oldExercises = loaded.exercises && typeof loaded.exercises === 'object' ? loaded.exercises : {};
  const oldByName = {};
  Object.keys(oldExercises).forEach((id) => { const e = oldExercises[id]; if (e && e.name) oldByName[key(e.name)] = { ...e, cat: fixLegacyCat(e), _oldId: id }; });
  const photos = {};
  const exercises = {};
  const usados = {};
  Object.keys(seed.exercises).forEach((id) => {
    const ex = clone(seed.exercises[id]);
    const old = oldByName[key(ex.name)];
    if (old) {
      usados[old._oldId] = true;
      const hist = (Array.isArray(old.history) ? old.history : []).map((h, i) => (i === 0 ? { ...h, seed: true } : h));
      if (hist.length) ex.history = hist;
      if (old.photo) photos[id] = old.photo;
    }
    exercises[id] = ex;
  });
  // Ejercicios antiguos sin equivalente: se guardan ocultos (no salen en ningún día) para no perder su historial
  Object.keys(oldExercises).forEach((id) => {
    const e = oldExercises[id];
    if (!e || typeof e !== 'object' || usados[id]) return;
    const nid = 'antiguo_' + id;
    exercises[nid] = { ...e, cat: fixLegacyCat(e) };
    if (e.photo) photos[nid] = e.photo;
  });
  const diana = { estados: {}, titulos: {} };
  const prof = loaded.profile || {};
  (prof.fuertes || []).forEach((x) => { if (CATS[x.region]) { diana.estados[x.region] = 'fuerte'; if (x.titulo) diana.titulos[x.region] = x.titulo; } });
  (prof.prioridad || []).forEach((x) => { if (CATS[x.region]) { diana.estados[x.region] = 'debil'; if (x.titulo) diana.titulos[x.region] = x.titulo; } });
  (prof.equilibrio || []).forEach((x) => { if (CATS[x.region] && x.titulo) diana.titulos[x.region] = x.titulo; });
  PENDING_PHOTOS = Object.keys(photos).length ? photos : null;
  const lm = loaded.meta || {};
  const next = {
    ...seed,
    exercises,
    days: seed.days,
    diana,
    cardio: Array.isArray(loaded.cardio) ? loaded.cardio : seed.cardio,
    formulario: { ...seed.formulario, ...(loaded.formulario || {}) },
    peso: { ...seed.peso, ...(loaded.peso || {}) },
    extras: loaded.extras ? { movilidad: { ...seed.extras.movilidad, ...((loaded.extras || {}).movilidad || {}) }, suplementos: Array.isArray((loaded.extras || {}).suplementos) ? loaded.extras.suplementos : seed.extras.suplementos } : seed.extras,
    nutricion: { ...seed.nutricion, ...(loaded.nutricion || {}) },
    comida: loaded.comida && typeof loaded.comida === 'object' ? loaded.comida : seed.comida,
    meta: { ...seed.meta, activeTab: TAB_IDS.indexOf(lm.activeTab) !== -1 ? lm.activeTab : 'rutina', editMode: false },
    version: APP_VERSION,
  };
  delete next.formulario.esNacho; delete next.formulario.completado; delete next.formulario.experiencia;
  return normalizeCurrent(next, seed);
}

// MIGRACIONES INCREMENTALES (de la versión 6 en adelante). Nunca sustituyen la rutina del usuario.
// MIGRATIONS[n] convierte datos de la versión n-1 a la versión n. Para una versión nueva de la app:
// sube APP_VERSION y añade aquí MIGRATIONS[nueva] (aunque sea vacía).
const LEGACY_MAX_VERSION = 5; // version ausente o <= 5 = app antigua (se usa upgradeLegacy)
const MIGRATIONS = {
  // v6 → v7: lumbar y abductores. El peso muerto belt pasa a Lumbar y la abducción de cadera a Abductores
  // (solo si siguen con el músculo que traían por defecto: si ya los cambiaste tú, no se tocan).
  7: (st) => {
    const exercises = { ...(st.exercises || {}) };
    if (exercises.pesoMuertoBelt && exercises.pesoMuertoBelt.cat === 'isquios') exercises.pesoMuertoBelt = { ...exercises.pesoMuertoBelt, cat: 'lumbar' };
    if (exercises.abduccion && exercises.abduccion.cat === 'gluteo') exercises.abduccion = { ...exercises.abduccion, cat: 'abductores' };
    return { ...st, exercises };
  },
};

function migrateState(loaded) {
  const seed = buildInitialState();
  if (!loaded || typeof loaded !== 'object') return seed;
  const v = Number(loaded.version);
  if (!isFinite(v) || v <= LEGACY_MAX_VERSION) return upgradeLegacy(loaded, seed);
  let st = loaded;
  for (let target = Math.floor(v) + 1; target <= APP_VERSION; target++) {
    if (MIGRATIONS[target]) st = MIGRATIONS[target](st);
  }
  return normalizeCurrent(st, seed);
}


/* =========================================================================
   SECCIÓN 5 · COMPARTIR Y EXPORTAR
   Código de texto para pasar tus datos a otro móvil o a un amigo, y archivos de texto, Excel y Word.
   ========================================================================= */

/* =========================================================================
   COMPARTIR / IMPORTAR / COPIA DE SEGURIDAD
   Código de texto:  GYMR1.<huella>.<datos comprimidos con LZString>
   Sirve para pasar tu rutina a un amigo y para cambiar de móvil sin perder nada.
   ========================================================================= */

function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function encodeShare(obj) {
  const payload = LZString.compressToEncodedURIComponent(JSON.stringify(obj));
  return 'GYMR1.' + hashStr(payload) + '.' + payload;
}

// Devuelve { ok, obj } o { ok:false, error } con un mensaje claro
function decodeShare(text) {
  const t = String(text || '').replace(/\s+/g, '');
  if (!t) return { ok: false, error: 'No has pegado ningún código.' };
  if (t.indexOf('GYMR1.') !== 0) return { ok: false, error: 'Este texto no es un código de la app (debe empezar por GYMR1.). Revisa que lo has copiado entero.' };
  const parts = t.split('.');
  if (parts.length !== 3 || !parts[2]) return { ok: false, error: 'El código está incompleto. Pídelo otra vez y cópialo entero.' };
  if (hashStr(parts[2]) !== parts[1]) return { ok: false, error: 'El código está corrupto o le falta un trozo (la huella no coincide). Pídelo de nuevo.' };
  let json = null;
  try { json = LZString.decompressFromEncodedURIComponent(parts[2]); } catch (e) { json = null; }
  if (!json) return { ok: false, error: 'No se ha podido descomprimir el código. Está corrupto.' };
  let obj = null;
  try { obj = JSON.parse(json); } catch (e) { return { ok: false, error: 'El contenido del código no es válido.' }; }
  if (!obj || typeof obj !== 'object' || obj.app !== 'gymtracker' || !obj.rutina || !Array.isArray(obj.rutina.days) || !obj.rutina.exercises || typeof obj.rutina.exercises !== 'object' || Array.isArray(obj.rutina.exercises)) {
    return { ok: false, error: 'El código no contiene una rutina válida.' };
  }
  const exs = obj.rutina.exercises;
  const badEx = Object.keys(exs).some((id) => !exs[id] || typeof exs[id] !== 'object' || typeof exs[id].name !== 'string');
  const badDay = obj.rutina.days.some((d) => !d || typeof d !== 'object' || !Array.isArray(d.ids));
  if (badEx || badDay) return { ok: false, error: 'La rutina del código tiene datos con un formato que no se puede leer.' };
  const bad = [];
  obj.rutina.days.forEach((d) => { d.ids.forEach((id) => { if (!exs[id]) bad.push(id); }); });
  if (bad.length) return { ok: false, error: 'La rutina del código está rota (días que apuntan a ejercicios que no existen).' };
  return { ok: true, obj: obj };
}

// opts: { historial, peso, recetas, nutricion, todo, fotos }
function buildShareObject(state, opts, fotos) {
  const o = { app: 'gymtracker', v: 1, appVersion: APP_VERSION, creado: new Date().toISOString(), nombre: (state.formulario && state.formulario.nombre) || '' };
  const defs = {};
  Object.keys(state.exercises).forEach((id) => { const e = { ...state.exercises[id] }; delete e.history; defs[id] = e; });
  o.rutina = { days: state.days, exercises: defs };
  if (opts.historial) { o.historial = {}; Object.keys(state.exercises).forEach((id) => { o.historial[id] = state.exercises[id].history; }); }
  if (opts.peso) o.peso = state.peso;
  if (opts.recetas) { o.recetas = state.comida.recetas; o.favoritos = state.comida.favoritos; }
  if (opts.nutricion) o.nutricion = { nutricion: state.nutricion, formulario: state.formulario, plan: state.comida.plan };
  if (opts.todo) {
    o.extra = { cardio: state.cardio, diana: state.diana, extras: state.extras, diario: state.comida.diario, agua: state.comida.agua, compra: state.comida.compra };
  }
  if (opts.fotos && fotos) o.fotos = fotos;
  return o;
}

function describeShare(obj) {
  const out = [];
  out.push('Rutina: ' + obj.rutina.days.length + ' días y ' + Object.keys(obj.rutina.exercises).length + ' ejercicios');
  if (obj.historial) out.push('Historial de ejercicios');
  if (obj.peso) out.push('Peso corporal (' + ((obj.peso.historial || []).length) + ' registros)');
  if (obj.recetas) out.push('Recetas (' + obj.recetas.length + ')');
  if (obj.nutricion) out.push('Nutrición (calculadora, tus datos y planificador)');
  if (obj.extra) out.push('Resto de datos (cardio, diana física, suplementos, diario de comidas, agua…)');
  if (obj.fotos) out.push('Fotos (' + Object.keys(obj.fotos).length + ')');
  return out;
}

// Aplica un código importado sobre el estado actual.
//  mode 'rutina' → solo días y ejercicios (conserva tu historial de los ejercicios con el mismo id)
//  mode 'todo'   → reemplaza todas las secciones que trae el código (las que no trae, no se tocan)
function applyImport(prev, obj, mode) {
  const next = { ...prev };
  const histOf = (id) => {
    if (mode === 'todo' && obj.historial && Array.isArray(obj.historial[id])) return obj.historial[id];
    return prev.exercises[id] ? prev.exercises[id].history : [];
  };
  // En modo "solo la rutina" tus ejercicios que no vienen en el código se conservan ocultos (con su historial):
  // no salen en ningún día, pero no se pierde nada y vuelven si se importa una rutina que los use.
  const exercises = mode === 'todo' ? {} : { ...prev.exercises };
  Object.keys(obj.rutina.exercises).forEach((id) => { exercises[id] = { ...obj.rutina.exercises[id], history: histOf(id) }; });
  next.exercises = exercises;
  next.days = obj.rutina.days;
  next.meta = { ...prev.meta, activeDay: obj.rutina.days.length ? obj.rutina.days[0].id : null };
  if (mode === 'todo') {
    if (obj.peso) next.peso = obj.peso;
    if (obj.nutricion) {
      next.nutricion = obj.nutricion.nutricion || prev.nutricion;
      next.formulario = { ...(obj.nutricion.formulario || prev.formulario), nombre: prev.formulario.nombre };
      next.comida = { ...prev.comida, plan: obj.nutricion.plan || prev.comida.plan };
    }
    if (obj.recetas) next.comida = { ...next.comida, recetas: obj.recetas, favoritos: obj.favoritos || [] };
    if (obj.extra) {
      const x = obj.extra;
      if (x.cardio) next.cardio = x.cardio;
      if (x.diana) next.diana = x.diana;
      if (x.extras) next.extras = x.extras;
      next.comida = { ...next.comida, diario: x.diario || next.comida.diario, agua: x.agua || next.comida.agua, compra: x.compra || next.comida.compra };
    }
  }
  return migrateState({ ...next, version: APP_VERSION });
}

/* =========================================================================
   EXPORTAR: TEXTO, EXCEL (CSV con ";" y UTF-8 con BOM) Y WORD (.doc)
   ========================================================================= */

const CSV_HEADER = ['Dia', 'Equipo', 'Ejercicio', 'Musculo', 'Serie', 'Tipo', 'Repeticiones', 'Peso_kg', 'Nota_serie', 'Objetivo', 'Objetivo_kg', 'Comentarios'];
const TIPO_CSV = { top: 'top set', backoff: 'back-off', rp: 'rest-pause', drop: 'dropset', warm: 'calentamiento' };

function csvEsc(v) {
  const s = String(v === null || v === undefined ? '' : v);
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvNum(n) { return n === null || n === undefined ? '' : String(n).replace('.', ','); }

function buildCsv(state) {
  const lines = [CSV_HEADER.join(';')];
  (state.days || []).forEach((d) => {
    (d.ids || []).forEach((id) => {
      const ex = state.exercises[id];
      if (!ex) return;
      (ex.currentSets || []).forEach((s, i) => {
        let reps, peso;
        // Varias cifras en una celda van separadas por " · " (con "/" Excel convertía "8/7" en la fecha 8-jul)
        if (s.tipo === 'rp') { reps = (s.tandas || []).map((r) => csvNum(r) || '–').join(' · '); peso = csvNum(s.weight); }
        else if (s.tipo === 'drop') { reps = (s.drops || []).map((x) => csvNum(x.reps) || '–').join(' · '); peso = (s.drops || []).map((x) => csvNum(x.weight) || '–').join(' · '); }
        else { reps = csvNum(s.reps); peso = csvNum(s.weight); }
        lines.push([d.label, d.equipo, ex.name, CATS[ex.cat].label, i + 1, TIPO_CSV[s.tipo] || 'top set', reps, peso, s.nota || '',
          ex.objetivo ? ex.objetivo.text : '', ex.objetivo && ex.objetivo.value !== null && ex.objetivo.value !== undefined ? csvNum(ex.objetivo.value) : '',
          ex.comentario || ''].map(csvEsc).join(';'));
      });
    });
  });
  return '\uFEFF' + lines.join('\r\n') + '\r\n';
}

// Documento .doc: HTML con la cabecera de Word (Word, LibreOffice y Google Docs lo abren)
function buildDocHtml(state) {
  const nombre = (state.formulario && state.formulario.nombre) || '';
  let h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Mi rutina</title>'
    + '<style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#111}h1{font-size:20pt}h2{font-size:14pt;margin-top:18pt;border-bottom:1px solid #999}'
    + 'table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:4px 6px;vertical-align:top;font-size:10pt}th{background:#e8eef7;text-align:left}</style></head><body>';
  h += '<h1>Mi rutina' + (nombre ? ' — ' + escHtml(nombre) : '') + '</h1><p>Generada el ' + escHtml(new Date().toLocaleDateString('es-ES')) + '</p>';
  (state.days || []).forEach((d) => {
    h += '<h2>' + escHtml(d.label) + '</h2>';
    if (d.equipo) h += '<p><b>Llevar:</b> ' + escHtml(d.equipo) + '</p>';
    if (d.nota) h += '<p><i>' + escHtml(d.nota) + '</i></p>';
    h += '<table><tr><th>Ejercicio</th><th>Músculo</th><th>Series</th><th>Objetivo</th><th>Comentarios</th></tr>';
    (d.ids || []).forEach((id) => {
      const ex = state.exercises[id];
      if (!ex) return;
      h += '<tr><td>' + escHtml(ex.name) + (ex.altName ? '<br><i>o ' + escHtml(ex.altName) + '</i>' : '') + '</td><td>' + escHtml(CATS[ex.cat].label) + '</td><td>'
        + (ex.currentSets || []).map((s, i) => (i + 1) + '. ' + escHtml(describeSet(s)) + (s.nota ? ' (' + escHtml(s.nota) + ')' : '')).join('<br>')
        + '</td><td>' + escHtml(ex.objetivo ? ex.objetivo.text : '') + '</td><td>' + escHtml(ex.comentario || '').replace(/\n/g, '<br>') + '</td></tr>';
    });
    h += '</table>';
  });
  return h + '</body></html>';
}

// Texto plano: todo junto y con orden (rutina por días, cardio, suplementos, diana, peso y calculadora)
function buildTxt(state) {
  const f = state.formulario || {};
  const L = [];
  const raya = '='.repeat(52);
  L.push('MI RUTINA' + (f.nombre ? ' — ' + f.nombre : ''));
  L.push('Generada el ' + new Date().toLocaleDateString('es-ES'));
  L.push('');
  (state.days || []).forEach((d, i) => {
    L.push(raya); L.push('DÍA ' + (i + 1) + ': ' + d.label.toUpperCase()); L.push(raya);
    if (d.equipo) L.push('Llevar: ' + d.equipo);
    if (d.nota) L.push('Nota del día: ' + d.nota);
    L.push('');
    (d.ids || []).forEach((id, j) => {
      const ex = state.exercises[id];
      if (!ex) return;
      L.push((j + 1) + '. ' + ex.name + '  [' + CATS[ex.cat].label + ']');
      if (ex.altName) L.push('   Alternativa: ' + ex.altName);
      (ex.currentSets || []).forEach((s, k) => L.push('   Serie ' + (k + 1) + ': ' + describeSet(s) + (s.nota ? ' (' + s.nota + ')' : '')));
      if (ex.objetivo) L.push('   Objetivo: ' + ex.objetivo.text);
      if (ex.marcaAntigua) L.push('   Marca antigua a recuperar: ' + ex.marcaAntigua.text);
      if (ex.comentario) L.push('   Comentarios: ' + String(ex.comentario).replace(/\n/g, '\n      '));
      L.push('');
    });
  });
  if ((state.cardio || []).length) {
    L.push(raya); L.push('CARDIO'); L.push(raya);
    state.cardio.forEach((c) => L.push('- ' + c.name + (c.frecuencia ? ' · ' + c.frecuencia : '') + (c.detalle ? ' · ' + c.detalle : '')));
    L.push('');
  }
  if ((state.extras.suplementos || []).length) {
    L.push(raya); L.push('SUPLEMENTACIÓN'); L.push(raya);
    state.extras.suplementos.forEach((s) => {
      L.push('- ' + s.nombre + (s.nota ? ' (' + s.nota + ')' : ''));
      s.filas.forEach((r) => L.push('    ' + r.label + ': ' + r.value));
    });
    L.push('');
  }
  L.push(raya); L.push('DIANA FÍSICA'); L.push(raya);
  [['fuerte', 'Puntos fuertes'], ['intermedio', 'Intermedios'], ['debil', 'Puntos débiles']].forEach((g) => {
    const lista = CAT_IDS.filter((k) => state.diana.estados[k] === g[0]);
    L.push(g[1] + ': ' + (lista.length ? lista.map((k) => CATS[k].label + (state.diana.titulos[k] ? ' (' + state.diana.titulos[k] + ')' : '')).join(', ') : '—'));
  });
  L.push('');
  const hist = (state.peso.historial || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  L.push(raya); L.push('PESO CORPORAL'); L.push(raya);
  if (state.peso.objetivoKg) L.push('Objetivo: ' + state.peso.objetivoKg + ' kg');
  hist.slice(-12).forEach((r) => L.push(new Date(r.date).toLocaleDateString('es-ES') + ': ' + fmt(r.kg, 2) + ' kg'));
  L.push('');
  const ef = effNutri(state);
  if (!ef.plan.falta) {
    L.push(raya); L.push('NUTRICIÓN (' + ef.obj.label + ')'); L.push(raya);
    L.push('Calorías al día: ' + ef.plan.kcal + ' kcal');
    L.push('Proteína: ' + ef.plan.protG + ' g · Hidratos: ' + ef.plan.carbG + ' g · Grasas: ' + ef.plan.fatG + ' g');
    L.push('');
  }
  return L.join('\n');
}

function LineChartSVG({ points, color = '#22D3EE', height = 180, onPointClick, selectedIndex }) {
  const w = 320;
  const padL = 36, padR = 14, padT = 16, padB = 26;
  const valid = points.filter((p) => typeof p.y === 'number');
  if (valid.length < 2) return null;
  const ys = valid.map((p) => p.y);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.15;
  min -= pad; max += pad;
  const innerW = w - padL - padR, innerH = height - padT - padB;
  const xAt = (i) => (valid.length === 1 ? padL + innerW / 2 : padL + (innerW * i) / (valid.length - 1));
  const yAt = (v) => padT + innerH - ((v - min) / (max - min)) * innerH;
  const path = valid.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i).toFixed(1)} ${yAt(p.y).toFixed(1)}`).join(' ');
  const area = `${path} L ${xAt(valid.length - 1).toFixed(1)} ${(padT + innerH).toFixed(1)} L ${xAt(0).toFixed(1)} ${(padT + innerH).toFixed(1)} Z`;
  const gid = 'lg' + color.replace('#', '');
  const gridLines = 3;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.38" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {Array.from({ length: gridLines + 1 }).map((_, i) => {
        const v = min + ((max - min) * i) / gridLines;
        const y = yAt(v);
        return (
          <g key={i}>
            <line x1={padL} y1={y} x2={w - padR} y2={y} stroke="rgba(140,170,255,0.14)" strokeWidth="1" strokeDasharray="2,4" />
            <text x={4} y={y + 4} fontSize="10" fill="#A9B3CC" fontFamily="Inter, sans-serif">{Math.round(v)}</text>
          </g>
        );
      })}
      <path d={area} fill={`url(#${gid})`} />
      <path d={path} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
      {selectedIndex !== null && selectedIndex !== undefined && valid[selectedIndex] && (
        <line x1={xAt(selectedIndex)} y1={padT} x2={xAt(selectedIndex)} y2={height - padB} stroke={color} strokeWidth="1" strokeDasharray="3,3" opacity="0.6" />
      )}
      {valid.map((p, i) => (
        <circle key={i} cx={xAt(i)} cy={yAt(p.y)} r={i === selectedIndex ? 7 : i === valid.length - 1 ? 5 : 3.5}
          fill={i === selectedIndex ? '#FFFFFF' : color} stroke={i === selectedIndex ? color : '#060913'} strokeWidth={i === selectedIndex ? 3 : 1.5} />
      ))}
      {onPointClick && valid.map((p, i) => (
        <circle key={'hit' + i} cx={xAt(i)} cy={yAt(p.y)} r={14} fill="transparent"
          onClick={() => onPointClick(i)} style={{ cursor: 'pointer' }} />
      ))}
      {valid.map((p, i) => {
        if (valid.length > 6 && i % Math.ceil(valid.length / 6) !== 0 && i !== valid.length - 1) return null;
        return <text key={'t' + i} x={xAt(i)} y={height - 6} fontSize="10" fill="#C9D3EE" fontFamily="Inter, sans-serif" textAnchor="middle">{p.label}</text>;
      })}
    </svg>
  );
}

// Campo numérico que acepta coma o punto decimal en cualquier teclado ("102,5").
// Es un campo de texto con teclado numérico (inputMode decimal) en lugar de un campo de tipo número,
// porque el de tipo número devuelve vacío con la coma en algunos teclados y navegadores y el valor se borraba.
// Mientras escribes se respeta lo que llevas ("7," no se pierde); al salir del campo se muestra con formato.
function NumInput({ value, onChange, placeholder, className, style, title }) {
  const [txt, setTxt] = useState(formatDecimal(value));
  const focused = useRef(false);
  useEffect(() => {
    const cur = parseDecimal(txt);
    if (!focused.current || (cur !== undefined && cur !== value)) setTxt(formatDecimal(value));
  }, [value]); // eslint-disable-line react-hooks/exhaustive-deps
  return (
    <input type="text" inputMode="decimal" autoComplete="off" spellCheck={false} placeholder={placeholder} title={title}
      value={txt}
      onFocus={() => { focused.current = true; }}
      onBlur={() => { focused.current = false; setTxt(formatDecimal(value)); }}
      onChange={(e) => {
        const t = e.target.value;
        if (t.trim() !== '' && !/^\d*[.,]?\d*$/.test(t.trim())) return; // ignora letras y símbolos
        setTxt(t);
        const v = parseDecimal(t);
        if (v !== undefined && v !== value) onChange(v);
      }}
      className={className} style={style} />
  );
}

// Devuelve manejadores táctiles: deslizar a la izquierda / derecha (con umbral para no confundirlo con el scroll vertical)
function useSwipe(onLeft, onRight) {
  const st = useRef(null);
  return {
    onTouchStart: (e) => { const t = e.touches[0]; st.current = { x: t.clientX, y: t.clientY }; },
    onTouchEnd: (e) => {
      if (!st.current) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - st.current.x, dy = t.clientY - st.current.y;
      st.current = null;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) { if (dx < 0) onLeft(); else onRight(); }
    },
  };
}

  const prevLast = hist.length > 1 ? hist[hist.length - 2] : null;
  let trend = null;
  if (last && prevLast) {
    const a = computeScore(last.sets && last.sets[0]);
    const b = computeScore(prevLast.sets && prevLast.sets[0]);
    if (a > 0 && b > 0) trend = a > b ? 'up' : a < b ? 'down' : 'same';
  }
  const foto = fotos ? fotos[id] : null;
  const mc = CATS[ex.cat].color; // cada músculo tiene su color; todos los ejercicios del mismo músculo comparten color
  const chipSt = chipStyle(mc);

  const setSet = (idx, patch) => {
    const cur = ex.currentSets[idx];
    const sets = ex.currentSets.map((s, i) => (i === idx ? ensureStruct({ ...s, ...patch }) : s));
    let key = null;
    if ('reps' in patch || 'weight' in patch || 'nota' in patch) key = 'set:' + id + ':' + idx + ':' + Object.keys(patch).join();
    else if (patch.tandas && cur.tandas && patch.tandas.length === cur.tandas.length) key = 'set:' + id + ':' + idx + ':tandas';
    else if (patch.drops && cur.drops && patch.drops.length === cur.drops.length) key = 'set:' + id + ':' + idx + ':drops';
    updateExercise(id, { currentSets: sets }, key);
  };

  const onPickPhoto = async () => {
    const url = await Native.pickPhoto();
    if (url) setFoto(id, url);
  };

  const askRemove = () => askConfirm({
    title: '¿Quitar ejercicio?',
    text: 'Se quitará "' + ex.name + '" de este día. Desaparecerá también de Progreso, de las series semanales y de tus objetivos.',
    confirmLabel: 'Quitar', onConfirm: () => removeFromDay(dayId, id),
  });

  return (
    <div className="card" style={{ marginBottom: 12, padding: 0, overflow: 'hidden' }}>
      <div onClick={() => setOpen(!open)} style={{ textAlign: 'left', padding: '14px', display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
        {editMode && dayId && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 4, flexShrink: 0 }} onClick={(e) => e.stopPropagation()}>
            <MiniBtn title="Subir" disabled={isFirst} onClick={() => moveExercise(dayId, id, -1)}>▲</MiniBtn>
            <MiniBtn title="Bajar" disabled={isLast} onClick={() => moveExercise(dayId, id, 1)}>▼</MiniBtn>
          </div>
        )}
        <div style={{ width: 4, alignSelf: 'stretch', borderRadius: 4, background: mc, minHeight: 34, flexShrink: 0, boxShadow: '0 0 12px ' + mc + '99' }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="font-body" style={{ color: T.text, fontWeight: 700, fontSize: 15, display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
            {ex.name}
            {trend === 'up' && <span title="Mejorando">📈</span>}
            {trend === 'down' && <span title="Ha bajado">📉</span>}
            {ex.comentario ? <span title="Tiene comentarios" style={{ fontSize: 12 }}>📝</span> : null}
          </div>
          <div className="font-body" style={{ color: T.muted, fontSize: 11.5, marginTop: 2 }}><b style={{ color: mc }}>{CATS[ex.cat].label}</b>{ex.altName ? ' · 🔁 o ' + ex.altName : ''}</div>
          <div style={{ display: 'flex', gap: 6, marginTop: 7, flexWrap: 'wrap' }}>
            {record !== null && <span className="font-body" style={{ ...chipSt, fontWeight: 700 }}>🏆 {fmt(record)} kg</span>}
            {ex.objetivo && <span className="font-body" style={chipSt}>🎯 {ex.objetivo.text}</span>}
            {!ex.objetivo && <span className="font-body" style={chipSt}>Sin objetivo — ponlo tú o pide una sugerencia</span>}
            {ex.marcaAntigua && <span className="font-body" style={chipSt}>↩️ recuperar {ex.marcaAntigua.text}</span>}
          </div>
        </div>
        {foto && <img src={foto} alt="" style={{ width: 48, height: 48, borderRadius: 12, objectFit: 'cover', flexShrink: 0, border: '2px solid ' + mc }} />}
        <span style={{ color: T.muted, flexShrink: 0, transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .2s', fontSize: 13 }}>▼</span>
      </div>

      {open && (
        <div style={{ padding: '0 14px 16px 14px', borderTop: '1px solid rgba(140,170,255,0.14)' }}>
          {editMode && (
            <div style={{ marginTop: 12 }}>

function groupByMonth(hist) {
  const map = {};
  hist.forEach((h) => { const key = ymd(h.date).slice(0, 7); (map[key] = map[key] || []).push(h); });
  return Object.keys(map).sort().map((key) => ({ key, entries: map[key] }));
}
function monthLabel(key) {
  const p = key.split('-').map(Number);
  return new Date(p[0], p[1] - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
}

const RANGOS = [['mes', 'Mes'], ['3m', '3 meses'], ['6m', '6 meses'], ['todo', 'Todo']];

function PesoChartPanel({ big, st, setSt }) {
  const { state, commit, askConfirm } = useGym();
  const [editing, setEditing] = useState(null);
  const hist = useMemo(() => (state.peso.historial || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date)), [state.peso.historial]);
  const months = useMemo(() => groupByMonth(hist), [hist]);
  const mIdx = st.monthIdx === null ? months.length - 1 : Math.max(0, Math.min(st.monthIdx, months.length - 1));

  let entries = [];
  let etiqueta = '';
  if (st.range === 'mes') { entries = months[mIdx] ? months[mIdx].entries : []; etiqueta = months[mIdx] ? monthLabel(months[mIdx].key) : 'Sin registros'; }
  else if (st.range === 'todo') { entries = hist; etiqueta = 'Todo el historial'; }
  else { const dias = st.range === '3m' ? 92 : 183; const corte = Date.now() - dias * 86400000; entries = hist.filter((h) => new Date(h.date).getTime() >= corte); etiqueta = st.range === '3m' ? 'Últimos 3 meses' : 'Últimos 6 meses'; }

  const points = entries.map((h) => ({ label: fmtDateShort(h.date), y: h.kg, id: h.id }));
  const selIdx = st.selId ? entries.findIndex((h) => h.id === st.selId) : -1;
  const sel = selIdx >= 0 ? entries[selIdx] : null;
  const kgs = entries.map((h) => h.kg);
  const resumen = entries.length ? { media: mean(kgs), primero: entries[0], ultimo: entries[entries.length - 1], dif: entries[entries.length - 1].kg - entries[0].kg } : null;

  const goMonth = (d) => {
    if (st.range !== 'mes') return;
    const n = Math.max(0, Math.min(months.length - 1, mIdx + d));
    setSt({ ...st, monthIdx: n, selId: null });
  };
  const swipe = useSwipe(() => goMonth(-1), () => goMonth(1)); // deslizar a la izquierda = mes anterior, a la derecha = mes siguiente

  const saveEdit = (val, fecha) => {
    commit((prev) => ({ ...prev, peso: { ...prev.peso, historial: prev.peso.historial.map((r) => (r.id === editing.id ? { ...r, kg: val, date: new Date(fecha + 'T12:00:00').toISOString() } : r)) } }), {});
  };
  const askDelete = () => askConfirm({
    title: '¿Borrar este registro?', text: fmtDateLong(sel.date) + ': ' + fmt(sel.kg, 2) + ' kg',
    confirmLabel: 'Borrar',
    onConfirm: () => { commit((prev) => ({ ...prev, peso: { ...prev.peso, historial: prev.peso.historial.filter((r) => r.id !== sel.id) } })); setSt({ ...st, selId: null }); },
  });

  return (
    <div>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
        {RANGOS.map((r) => <Chip key={r[0]} active={st.range === r[0]} onClick={() => setSt({ ...st, range: r[0], selId: null })} style={{ padding: '6px 12px', fontSize: 12 }}>{r[1]}</Chip>)}
      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, marginBottom: 6 }}>
        {st.range === 'mes' && <MiniBtn disabled={mIdx <= 0} onClick={() => goMonth(-1)}>‹</MiniBtn>}
        <span className="font-body" style={{ color: '#E7EAF8', fontSize: 12.5, fontWeight: 700, textTransform: 'capitalize', minWidth: 130, textAlign: 'center' }}>{etiqueta}</span>
        {st.range === 'mes' && <MiniBtn disabled={mIdx >= months.length - 1} onClick={() => goMonth(1)}>›</MiniBtn>}
      </div>

      <div {...swipe}>
        {points.length >= 2 ? (
          <LineChartSVG points={points} color="#22D3EE" height={big ? 320 : 200} selectedIndex={selIdx >= 0 ? selIdx : null} onPointClick={(i) => setSt({ ...st, selId: entries[i].id })} />
        ) : (
          <div className="font-body" style={{ color: T.dim, fontSize: 12, textAlign: 'center', padding: '24px 10px' }}>Necesitas al menos 2 registros en este periodo para ver la curva.</div>
        )}
      </div>
      {st.range === 'mes' && months.length > 1 && <div className="font-body" style={{ color: T.dim, fontSize: 10.5, textAlign: 'center', marginBottom: 6 }}>Desliza el dedo sobre el gráfico (izquierda = mes anterior, derecha = mes siguiente)</div>}

      {sel && (
        <div className="card" style={{ marginTop: 8, padding: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
          <div>
            <div className="font-body" style={{ color: T.text, fontWeight: 800, fontSize: 15 }}>{fmt(sel.kg, 2) + ' kg'}</div>
            <div className="font-body" style={{ color: T.muted, fontSize: 11.5, textTransform: 'capitalize' }}>{fmtDateLong(sel.date)}</div>
          </div>
          <div style={{ display: 'flex', gap: 6 }}>
            <button onClick={() => setEditing({ id: sel.id, valor: sel.kg, date: sel.date })} className="font-body btn btn-ghost" style={{ padding: '7px 10px', fontSize: 12 }}>✏️ Editar</button>
            <button onClick={askDelete} className="font-body btn btn-danger" style={{ padding: '7px 10px', fontSize: 12 }}>🗑️ Borrar</button>
          </div>
        </div>
      )}
      {!sel && points.length >= 2 && <div className="font-body" style={{ color: T.dim, fontSize: 11, textAlign: 'center', marginTop: 6 }}>Toca un punto para ver su fecha, editarlo o borrarlo</div>}

      {resumen && (
        <div style={{ marginTop: 12, paddingTop: 10, borderTop: '1px solid rgba(140,170,255,0.14)' }}>
          <SupRow label="Peso medio del periodo" value={fmt(resumen.media) + ' kg'} />
          <SupRow label={'Primer registro (' + fmtDateShort(resumen.primero.date) + ')'} value={fmt(resumen.primero.kg, 2) + ' kg'} />
          <SupRow label={'Último registro (' + fmtDateShort(resumen.ultimo.date) + ')'} value={fmt(resumen.ultimo.kg, 2) + ' kg'} />
          <SupRow label="Diferencia" value={(resumen.dif > 0 ? '+' : '') + fmt(resumen.dif) + ' kg'} highlight />
        </div>
      )}
      {editing && <EditRecordModal rec={editing} title="Editar peso" unit="kg" onSave={saveEdit} onClose={() => setEditing(null)} />}
    </div>
  );
}

function PesoCard() {
  const { state, logPeso } = useGym();
  const [draft, setDraft] = useState('');
  const [st, setSt] = useState({ range: 'mes', monthIdx: null, selId: null });
  const [big, setBig] = useState(false);
  const peso = state.peso;
  const hist = peso.historial || [];
  const sorted = hist.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const actual = sorted.length ? sorted[sorted.length - 1].kg : null;
  const hace30 = (() => {
    if (sorted.length < 2) return null;
    const now = new Date(sorted[sorted.length - 1].date);
    const target = new Date(now.getTime() - 30 * 86400000);
    let closest = sorted[0];
    sorted.forEach((h) => { if (new Date(h.date) <= target) closest = h; });
    return closest === sorted[sorted.length - 1] ? null : closest.kg;
  })();
  const bmi = calcBMI(actual, state.formulario.alturaCm);
  const bmiCat = bmiCategory(bmi);

  return (
    <Card style={{ marginBottom: 18 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10, gap: 8, flexWrap: 'wrap' }}>
        <div className="font-body" style={{ color: T.text, fontWeight: 700, fontSize: 15, whiteSpace: 'nowrap' }}>⚖️ Peso corporal</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {peso.objetivoKg && <div className="font-body" style={{ color: '#7DE9FA', fontSize: 11.5, fontWeight: 700 }}>{'🎯 ' + fmt(peso.objetivoKg, 2) + ' kg'}</div>}
          <button onClick={() => setBig(true)} className="font-body btn btn-ghost" style={{ padding: '6px 10px', fontSize: 12 }}>⤢ Ampliar</button>
        </div>
      </div>

      <div style={{ display: 'flex', gap: 22, marginBottom: 8 }}>
        <div>
          <div className="font-body" style={{ color: T.dim, fontSize: 11 }}>Actual</div>
          <div className="font-display" style={{ color: T.text, fontSize: 32, fontWeight: 700, lineHeight: 1.1 }}>{actual ? fmt(actual, 2) + ' kg' : '—'}</div>
        </div>
        {hace30 !== null && (
          <div>
            <div className="font-body" style={{ color: T.dim, fontSize: 11 }}>Últimos 30 días</div>
            <div className="font-body" style={{ color: actual < hace30 ? '#A3E635' : actual > hace30 ? '#FBBF24' : T.muted, fontWeight: 800, fontSize: 16, marginTop: 6 }}>
              {(actual - hace30 > 0 ? '+' : '') + fmt(Math.round((actual - hace30) * 10) / 10) + ' kg'}
            </div>
          </div>
        )}
      </div>

      <PesoChartPanel big={false} st={st} setSt={setSt} />

      <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
        <NumField forceEditable w={86} value={draft === '' ? null : draft} onChange={(v) => setDraft(v === null ? '' : v)} placeholder="kg" />
        <button onClick={() => { if (draft !== '' && !isNaN(draft)) { logPeso(parseFloat(draft)); setDraft(''); setSt({ range: st.range, monthIdx: null, selId: null }); } }} className="font-body btn btn-primary" style={{ flex: 1 }}>
          Registrar peso de hoy
        </button>
      </div>

      {bmi !== null && (
        <div style={{ marginTop: 14, paddingTop: 12, borderTop: '1px solid rgba(140,170,255,0.14)' }}>
          <div className="font-body" style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5 }}>
            <span style={{ color: T.muted }}>IMC (kg/m²)</span>
            <span style={{ color: T.text, fontWeight: 800 }}>{bmi.toFixed(1)} · <span style={{ color: bmiCat.color }}>{bmiCat.label}</span></span>
          </div>
          <div className="font-body" style={{ color: T.dim, fontSize: 10.5, marginTop: 5, lineHeight: 1.5 }}>
            El IMC no distingue músculo de grasa — con tu nivel de entrenamiento es normal marcar "sobrepeso" sin que sea grasa de más.
          </div>
        </div>
      )}
      {big && (
        <Modal title="⚖️ Peso corporal" onClose={() => setBig(false)}>
          <Card><PesoChartPanel big st={st} setSt={setSt} /></Card>
        </Modal>
      )}
    </Card>
  );
}

/* ---------- Series efectivas por semana y músculo (solo el recuento) ---------- */

function SeriesSemanalesCard() {
  const { state } = useGym();
  const totals = useMemo(() => weeklySets(state), [state.days, state.exercises]);
  const rows = CAT_IDS.map((k) => ({ key: k, ...CATS[k], sets: totals[k] || 0 }));
  const maxV = Math.max(10, ...rows.map((r) => r.sets)) * 1.08;
  const total = rows.reduce((acc, r) => acc + r.sets, 0);

  return (
    <Card style={{ marginBottom: 18 }}>
      <div className="font-body" style={{ color: T.muted, fontSize: 12, lineHeight: 1.5, marginBottom: 12 }}>
        Cada serie cuenta 1 y el calentamiento no cuenta. En rest-pause y dropset, cada tanda o descenso extra suma 0,5. Cada ejercicio cuenta solo para el músculo que le asignas.
      </div>
      <div style={{ marginBottom: 14 }}>
        <div className="font-body" style={{ color: T.dim, fontSize: 11 }}>Total semanal</div>
        <div className="font-display" style={{ color: T.text, fontSize: 30, fontWeight: 700, lineHeight: 1.1 }}>{fmt(total)} series</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {rows.map((r) => (
          <div key={r.key}>
            <div className="font-body" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12.5, marginBottom: 4 }}>
              <span style={{ color: T.text, fontWeight: 600 }}>{r.emoji} {r.label}</span>
              <span style={{ color: r.sets > 0 ? r.color : T.dim, fontWeight: 800 }}>{fmt(r.sets)}</span>

/* =========================================================================
   DIANA FÍSICA (mapa corporal + estado manual por músculo)

const ESTADO_COLOR = { fuerte: '#22C55E', intermedio: '#FBBF24', debil: '#F43F5E' };
const ESTADO_LABEL = { fuerte: 'Punto fuerte', intermedio: 'Intermedio', debil: 'Punto débil', none: 'Sin marcar' };

function BodyMap({ view, onSelect, selected }) {
  const { state } = useGym();
  const estados = state.diana.estados;
  const skin = '#3A4666';

  // Pinta una región (y su espejo para el lado derecho si hace falta)
  const region = (key, cat, d, mirror) => {
    const st = estados[cat];
    const fill = st ? ESTADO_COLOR[st] : '#3A4256';
    const isSel = selected === cat;
    const props = {
      d: d, fill: fill, fillOpacity: isSel ? 1 : 0.88, stroke: isSel ? '#FFFFFF' : 'rgba(0,0,0,0.3)', strokeWidth: isSel ? 2 : 1,
      onClick: () => onSelect(cat), style: { cursor: 'pointer', transition: 'all .15s ease' },
    };
    return (
      <g key={key}>
        <path {...props} />
        {mirror && <path {...props} transform="translate(200,0) scale(-1,1)" />}
      </g>
    );
  };

  const head = (
    <g>
      <circle cx="100" cy="34" r="21" fill={skin} />
      <path d="M90,52 Q100,60 110,52 L108,68 Q100,74 92,68 Z" fill={skin} />

      <circle cx="158" cy="212" r="7" fill={skin} />
