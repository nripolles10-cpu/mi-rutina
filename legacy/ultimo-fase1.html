      <path d="M127,280 Q131,320 126,358 L108,358 Q106,320 108,280 Z" fill={skin} />
      {region('f-hombro', 'hombro', 'M64,72 Q42,74 38,98 Q37,116 48,120 Q58,100 68,86 Z', true)}
      {region('f-pecho', 'pecho', 'M65,74 Q62,98 70,120 L130,120 Q138,98 135,74 Q100,60 65,74 Z')}
      {region('f-core', 'core', 'M70,120 Q66,148 76,174 L124,174 Q134,148 130,120 Z')}
      {region('f-biceps', 'biceps', 'M46,120 L67,120 L64,168 L45,164 Z', true)}
      {region('f-antebrazo', 'antebrazo', 'M45,166 L64,169 L60,206 L43,200 Z', true)}
      {region('f-cuadriceps', 'cuadriceps', 'M76,176 Q68,220 72,278 L90,278 Q92,230 90,176 Z', true)}
      {region('f-aductores', 'aductores', 'M90,176 L98,178 Q99,220 95,262 L90,262 Q92,220 90,176 Z', true)}
    </svg>
  );

  const back = (
    <svg viewBox="0 0 200 420" width="100%" height="340">
      {head}
      {region('b-hombro', 'hombro', 'M64,72 Q42,74 38,98 Q37,116 48,120 Q58,100 68,86 Z', true)}
      {region('b-espalda', 'espalda', 'M66,80 Q60,104 68,128 Q100,140 132,128 Q140,104 134,80 Q100,94 66,80 Z')}
      {region('b-trapecio', 'trapecio', 'M84,60 Q100,66 116,60 L134,78 Q100,94 66,78 Z')}
      {region('b-lumbar', 'lumbar', 'M80,128 Q100,138 120,128 L122,152 Q100,160 78,152 Z')}
      {region('b-triceps', 'triceps', 'M46,120 L67,120 L64,168 L45,164 Z', true)}
      {region('b-antebrazo', 'antebrazo', 'M45,166 L64,169 L60,206 L43,200 Z', true)}
      {region('b-gluteo', 'gluteo', 'M72,152 Q66,176 76,198 L124,198 Q134,176 128,152 Q100,162 72,152 Z')}
      {region('b-abductores', 'abductores', 'M64,150 Q58,168 66,186 L72,180 Q70,166 72,152 Z', true)}
      {region('b-isquios', 'isquios', 'M76,200 Q70,232 74,272 L96,272 Q98,232 96,200 Z', true)}
      {region('b-gemelos', 'gemelos', 'M73,274 Q69,316 74,358 L92,358 Q94,316 92,274 Z', true)}
    </svg>
  );
  return view === 'front' ? front : back;
}

function DianaFisicaTab() {
  const { state, commit } = useGym();
  const [view, setView] = useState('front');
  const [selected, setSelected] = useState('hombro');
  const prog = useMemo(() => muscleProgress(state), [state.days, state.exercises]);
  const estados = state.diana.estados;
  const titulos = state.diana.titulos;

  const setEstado = (cat, est) => commit((prev) => {
    const e = { ...prev.diana.estados };
    if (est === 'none') delete e[cat]; else e[cat] = est;
    return { ...prev, diana: { ...prev.diana, estados: e } };
  });
  const setTitulo = (cat, txt) => commit((prev) => ({ ...prev, diana: { ...prev.diana, titulos: { ...prev.diana.titulos, [cat]: txt } } }), { key: 'diana:' + cat });
  const ciclo = (cat) => { const cur = estados[cat] || 'none'; setEstado(cat, cur === 'none' ? 'fuerte' : cur === 'fuerte' ? 'intermedio' : cur === 'intermedio' ? 'debil' : 'none'); };

  const p = prog[selected];
  const estSel = estados[selected] || 'none';
  let aviso = null;
  if (p && p.pct !== null) {
    if (estSel === 'debil' && p.pct >= 95) aviso = 'Solo informativo: lo tienes marcado como débil, pero va al ' + Math.round(p.pct) + ' % de sus objetivos de levantamiento. Tú decides si lo cambias.';
    if (estSel === 'fuerte' && p.pct < 60) aviso = 'Solo informativo: lo tienes como fuerte, pero va al ' + Math.round(p.pct) + ' % de sus objetivos de levantamiento. Tú decides si lo cambias.';
  }
  const grupos = [['fuerte', 'Puntos fuertes'], ['intermedio', 'Intermedios'], ['debil', 'Puntos débiles'], ['none', 'Sin marcar']];

  return (
    <div>
      <SectionTitle emoji="🎯">Diana física</SectionTitle>
      <Card style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginBottom: 4 }}>
          <Chip active={view === 'front'} onClick={() => setView('front')}>Delante</Chip>
          <Chip active={view === 'back'} onClick={() => setView('back')}>Detrás</Chip>
        </div>
        <BodyMap view={view} onSelect={setSelected} selected={selected} />
        <div style={{ display: 'flex', justifyContent: 'center', gap: 14, marginTop: 4, marginBottom: 12, flexWrap: 'wrap' }}>
          {[['fuerte', '#22C55E'], ['intermedio', '#FBBF24'], ['debil', '#F43F5E'], ['none', '#3A4256']].map((x) => (
            <div key={x[0]} className="font-body" style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: T.muted }}>
              <span style={{ width: 9, height: 9, borderRadius: 999, background: x[1], display: 'inline-block' }} />{ESTADO_LABEL[x[0]]}
            </div>
          ))}
        </div>

        <div style={{ background: 'rgba(7,11,22,0.7)', border: '1px solid rgba(140,170,255,0.18)', borderRadius: 14, padding: 12 }}>
          <div className="font-body" style={{ color: T.text, fontWeight: 800, fontSize: 15, marginBottom: 8 }}>{CATS[selected].emoji} {CATS[selected].label}</div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
            <Chip active={estSel === 'fuerte'} accent="#22C55E" onClick={() => setEstado(selected, 'fuerte')}>Punto fuerte</Chip>
            <Chip active={estSel === 'intermedio'} accent="#FBBF24" onClick={() => setEstado(selected, 'intermedio')}>Intermedio</Chip>
            <Chip active={estSel === 'debil'} accent="#F43F5E" onClick={() => setEstado(selected, 'debil')}>Punto débil</Chip>
            <Chip active={estSel === 'none'} accent="#94A3B8" onClick={() => setEstado(selected, 'none')}>Sin marcar</Chip>
          </div>
          <Label>Título corto (opcional)</Label>
          <input type="text" maxLength={40} value={titulos[selected] || ''} onChange={(e) => setTitulo(selected, e.target.value)} placeholder="ej. Deltoides redondo" className="font-body inp" style={{ fontSize: 13 }} />
          <div className="font-body" style={{ marginTop: 10, fontSize: 12, color: T.muted, lineHeight: 1.5 }}>
            {p && p.pct !== null
              ? <>Progreso hacia tus objetivos de levantamiento: <b style={{ color: T.text }}>{Math.round(p.pct)} %</b> · te faltan de media <b style={{ color: T.text }}>{fmt(p.falta)} kg</b></>
              : 'Este músculo no tiene objetivos de levantamiento con número.'}
          </div>
          {aviso && <div className="font-body" style={{ marginTop: 8, fontSize: 11.5, color: '#FDE68A', lineHeight: 1.5 }}>ℹ️ {aviso}</div>}
        </div>
      </Card>

      {grupos.map((g) => {
        const lista = CAT_IDS.filter((k) => (estados[k] || 'none') === g[0]);
        if (!lista.length) return null;
        const col = g[0] === 'none' ? '#94A3B8' : ESTADO_COLOR[g[0]];
        return (
          <div key={g[0]} style={{ marginBottom: 14 }}>
            <div className="font-body" style={{ color: col, fontWeight: 800, fontSize: 13, marginBottom: 8 }}>{g[1]} ({lista.length})</div>
            {lista.map((k) => (
              <div key={k} onClick={() => setSelected(k)} className="card" style={{ borderLeft: '3px solid ' + col, borderRadius: 14, padding: '10px 12px', marginBottom: 6, display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', outline: selected === k ? '1.5px solid ' + ACCENT : 'none' }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="font-body" style={{ color: T.text, fontWeight: 700, fontSize: 13.5 }}>{CATS[k].label}{titulos[k] ? ' · ' + titulos[k] : ''}</div>
                  <div className="font-body" style={{ color: T.dim, fontSize: 11, marginTop: 2 }}>{prog[k].pct !== null ? 'Objetivos: ' + Math.round(prog[k].pct) + ' % · faltan ' + fmt(prog[k].falta) + ' kg' : 'sin objetivos'}</div>
                </div>
                <MiniBtn title="Cambiar estado" onClick={(e) => { e.stopPropagation(); ciclo(k); }}>⟳</MiniBtn>
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

const TIPO_RECETA = [['desayuno', 'Desayuno'], ['comida', 'Comida'], ['cena', 'Cena'], ['snack', 'Snack']];
function tipoRecetaLabel(t) { const x = TIPO_RECETA.find((y) => y[0] === t); return x ? x[1] : 'Comida'; }

function Stepper({ value, onChange, min, max, step, suffix }) {
  const st = step || 1;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      <MiniBtn disabled={value <= min} onClick={() => onChange(Math.max(min, Math.round((value - st) * 100) / 100))}>−</MiniBtn>
      <span className="font-display" style={{ color: T.text, fontSize: 22, fontWeight: 700, minWidth: 64, textAlign: 'center' }}>{fmt(value, 2)}{suffix ? ' ' + suffix : ''}</span>
      <MiniBtn disabled={value >= max} onClick={() => onChange(Math.min(max, Math.round((value + st) * 100) / 100))}>+</MiniBtn>
    </div>
  );
}

function recKcal(r) { return kcalOfMacros(r.p, r.c, r.g); }
function recTotals(r, raciones) { return { kcal: recKcal(r) * raciones, p: r.p * raciones, c: r.c * raciones, g: r.g * raciones }; }
function scaleQty(q, f) { return q === null || q === undefined || q === '' ? null : Math.round(Number(q) * f * 100) / 100; }
function qtyText(q, u) { return (q === null ? '' : fmt(q, 2) + ' ') + (u || ''); }

function MacroLine({ t, small }) {
  return (
    <span className="font-body" style={{ fontSize: small ? 11 : 12, color: T.muted }}>
      <b style={{ color: T.text }}>{Math.round(num(t.kcal)) + ' kcal'}</b>{' · P ' + fmt(num(t.p), 0) + ' · C ' + fmt(num(t.c), 0) + ' · G ' + fmt(num(t.g), 0)}
    </span>
  );
}

    <Modal title={titulo} onClose={onClose}>

function DiarioSec({ fecha, setFecha }) {
  const { state, commit, askConfirm } = useGym();
  const { plan } = effNutri(state);
  const lista = state.comida.diario[fecha] || [];
  const tot = entryTotals(lista);
  const [addMomento, setAddMomento] = useState(null);
  const [manual, setManual] = useState(null);
  const hoy = ymd(new Date());

  const addEntry = (momento, e) => commit((prev) => ({ ...prev, comida: { ...prev.comida, diario: { ...prev.comida.diario, [fecha]: (prev.comida.diario[fecha] || []).concat([{ id: uid(), momento, ...e }]) } } }));
  const setRac = (id, r) => commit((prev) => ({ ...prev, comida: { ...prev.comida, diario: { ...prev.comida.diario, [fecha]: (prev.comida.diario[fecha] || []).map((e) => {
    if (e.id !== id || !e.por) return e;
    return { ...e, raciones: r, kcal: e.por.kcal * r, p: e.por.p * r, c: e.por.c * r, g: e.por.g * r };
  }) } } }), { key: 'dia:' + id });
  const del = (id) => commit((prev) => ({ ...prev, comida: { ...prev.comida, diario: { ...prev.comida.diario, [fecha]: (prev.comida.diario[fecha] || []).filter((e) => e.id !== id) } } }));

  const filas = plan.falta ? [] : [
    ['Calorías', tot.kcal, plan.kcal, 'kcal', '#F5F7FF'], ['Proteína', tot.p, plan.protG, 'g', '#22D3EE'], ['Hidratos', tot.c, plan.carbG, 'g', '#A3E635'], ['Grasas', tot.g, plan.fatG, 'g', '#F472B6'],
  ];

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, marginBottom: 12 }}>
        <MiniBtn onClick={() => setFecha(ymd(addDays(fromYmd(fecha), -1)))}>‹</MiniBtn>
        <span className="font-body" style={{ color: T.text, fontWeight: 700, fontSize: 13, minWidth: 170, textAlign: 'center', textTransform: 'capitalize' }}>{fecha === hoy ? 'Hoy · ' : ''}{fmtDateLong(fromYmd(fecha).toISOString())}</span>
        <MiniBtn disabled={fecha >= hoy} onClick={() => setFecha(ymd(addDays(fromYmd(fecha), 1)))}>›</MiniBtn>
      </div>

      <Card style={{ marginBottom: 14 }}>
        {plan.falta ? (
          <div className="font-body" style={{ color: '#FDE68A', fontSize: 12.5, lineHeight: 1.5 }}>Rellena la calculadora nutricional (pestaña Extras) para ver cuánto te falta de tus calorías y macros. Ahora mismo llevas {Math.round(tot.kcal)} kcal.</div>
        ) : filas.map((f) => {
          const resta = f[2] - f[1];
          return (
            <div key={f[0]} style={{ marginBottom: 10 }}>
              <div className="font-body" style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, marginBottom: 4 }}>
                <span style={{ color: T.text, fontWeight: 700 }}>{f[0]}</span>
                <span style={{ color: T.muted }}>{fmt(f[1], 0)} / {fmt(f[2], 0)} {f[3]} · <b style={{ color: resta >= 0 ? '#A3E635' : '#FB7185' }}>{resta >= 0 ? 'faltan ' + fmt(resta, 0) : 'te pasas ' + fmt(-resta, 0)}</b></span>
              </div>
              <Bar pct={f[2] > 0 ? (f[1] / f[2]) * 100 : 0} color={f[4]} height={9} />
            </div>
          );
        })}
      </Card>

      {MOMENTOS.map((m) => {
        const items = lista.filter((e) => e.momento === m[0]);
        return (
          <Card key={m[0]} style={{ marginBottom: 10 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8, marginBottom: items.length ? 8 : 0 }}>
              <div className="font-body" style={{ color: T.text, fontWeight: 800, fontSize: 13.5 }}>{m[1]}</div>
              <div style={{ display: 'flex', gap: 6 }}>
                <button onClick={() => setAddMomento(m[0])} className="font-body btn btn-ghost" style={{ padding: '6px 10px', fontSize: 12 }}>🍳 Receta</button>
                <button onClick={() => setManual(m[0])} className="font-body btn btn-ghost" style={{ padding: '6px 10px', fontSize: 12 }}>✍️ A mano</button>
              </div>
            </div>
            {items.map((e) => (
              <div key={e.id} style={{ padding: '8px 0', borderTop: '1px solid rgba(140,170,255,0.12)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}>
                  <div style={{ minWidth: 0 }}>
                    <div className="font-body" style={{ color: T.text, fontWeight: 600, fontSize: 13 }}>{e.nombre}{e.por ? ' × ' + fmt(e.raciones, 2) : ''}</div>
                    <MacroLine t={e} small />
                  </div>
                  <MiniBtn title="Quitar" onClick={() => del(e.id)}>✕</MiniBtn>
                </div>
                {e.por && (
                  <div style={{ marginTop: 6 }}><Stepper value={e.raciones} onChange={(r) => setRac(e.id, r)} min={0.5} max={10} step={0.5} suffix="rac." /></div>
                )}
              </div>
            ))}
          </Card>
        );
      })}
      {lista.length > 0 && (
        <button onClick={() => askConfirm({ title: '¿Vaciar el día?', text: 'Se quitarán todas las comidas de este día.', confirmLabel: 'Vaciar', onConfirm: () => commit((prev) => { const d = { ...prev.comida.diario }; delete d[fecha]; return { ...prev, comida: { ...prev.comida, diario: d } }; }) })} className="font-body btn btn-danger" style={{ width: '100%', fontSize: 12.5 }}>🗑️ Vaciar este día</button>
      )}
      {addMomento && <PickRecetaModal titulo={'Añadir al diario · ' + addMomento} tipoInicial={addMomento}
        onPick={(r, rac) => addEntry(addMomento, { nombre: r.nombre, recetaId: r.id, raciones: rac, por: recTotals(r, 1), ...recTotals(r, rac) })} onClose={() => setAddMomento(null)} />}
      {manual && <AddManualModal momento={manual} onAdd={(e) => addEntry(manual, e)} onClose={() => setManual(null)} />}
    </div>
  );
}

function RecetaEditor({ receta, onClose }) {
  const { commit } = useGym();
  const nueva = !receta;
  const [r, setR] = useState(() => receta ? clone(receta) : { id: 'r_' + uid(), nombre: '', tipo: 'comida', objetivos: ['mantenimiento'], p: 0, c: 0, g: 0, ingredientes: [{ n: '', q: null, u: 'g' }], pasos: [], propia: true });
  const [pasosTxt, setPasosTxt] = useState((r.pasos || []).join('\n'));
  const upd = (patch) => setR({ ...r, ...patch });
  const setIng = (i, patch) => upd({ ingredientes: r.ingredientes.map((x, k) => (k === i ? { ...x, ...patch } : x)) });
  const toggleObj = (o) => upd({ objetivos: r.objetivos.indexOf(o) === -1 ? r.objetivos.concat([o]) : r.objetivos.filter((x) => x !== o) });
  const calc = macrosFromIngredientes(r.ingredientes);
  const conocidos = r.ingredientes.filter((x) => x.n.trim()).length - calc.desconocidos.length;
  const guardar = () => {
    const fin = { ...r, nombre: r.nombre.trim(), ingredientes: r.ingredientes.filter((x) => x.n.trim()), pasos: pasosTxt.split('\n').map((s) => s.trim()).filter(Boolean) };
    // Una receta de serie que modificas deja de garantizar que sus macros salen de las cantidades exactas
    if (!nueva && !fin.propia && JSON.stringify([fin.p, fin.c, fin.g, fin.ingredientes]) !== JSON.stringify([receta.p, receta.c, receta.g, receta.ingredientes])) fin.editada = true;
    commit((prev) => ({ ...prev, comida: { ...prev.comida, recetas: nueva ? prev.comida.recetas.concat([fin]) : prev.comida.recetas.map((x) => (x.id === fin.id ? fin : x)) } }));
    onClose();
  };
  return (
    <Modal title={nueva ? 'Nueva receta' : 'Editar receta'} onClose={onClose}>
      <Card>
        <Label>Nombre</Label>
        <input type="text" value={r.nombre} onChange={(e) => upd({ nombre: e.target.value })} className="font-body inp" style={{ marginBottom: 12 }} />
        <Label>Tipo</Label>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>{TIPO_RECETA.map((t) => <Chip key={t[0]} active={r.tipo === t[0]} onClick={() => upd({ tipo: t[0] })}>{t[1]}</Chip>)}</div>
        <Label>Objetivos para los que encaja</Label>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>{Object.keys(OBJETIVOS).map((o) => <Chip key={o} active={r.objetivos.indexOf(o) !== -1} accent={OBJETIVOS[o].color} onClick={() => toggleObj(o)}>{OBJETIVOS[o].label}</Chip>)}</div>
        <Label>Por ración</Label>
        <div style={{ display: 'flex', gap: 8, marginBottom: 6 }}>
          <LabeledNum label="Proteína" suffix="g" value={r.p} onChange={(v) => upd({ p: v === null ? 0 : v })} />
          <LabeledNum label="Hidratos" suffix="g" value={r.c} onChange={(v) => upd({ c: v === null ? 0 : v })} />
          <LabeledNum label="Grasas" suffix="g" value={r.g} onChange={(v) => upd({ g: v === null ? 0 : v })} />
        </div>
        <div className="font-body" style={{ color: T.muted, fontSize: 12, marginBottom: 8 }}>Calorías por ración (se calculan): <b style={{ color: T.text }}>{kcalOfMacros(r.p, r.c, r.g) + ' kcal'}</b></div>
        <button disabled={conocidos <= 0} onClick={() => upd({ p: calc.p, c: calc.c, g: calc.g })} className="font-body btn btn-ghost" style={{ width: '100%', padding: '8px', fontSize: 12, marginBottom: 6 }}>🧮 Calcular macros con los ingredientes</button>
        {calc.desconocidos.length > 0 && <div className="font-body" style={{ color: T.dim, fontSize: 11, lineHeight: 1.5, marginBottom: 12 }}>{'No están en la tabla de alimentos (no cuentan en el cálculo): ' + calc.desconocidos.join(', ') + '.'}</div>}
        {calc.desconocidos.length === 0 && <div style={{ marginBottom: 12 }} />}
        <Label>Ingredientes (cantidad por ración)</Label>
        {r.ingredientes.map((x, i) => (
          <div key={i} style={{ display: 'flex', gap: 6, marginBottom: 6, alignItems: 'center' }}>
            <input type="text" value={x.n} placeholder="Ingrediente" onChange={(e) => setIng(i, { n: e.target.value })} className="font-body inp" style={{ flex: 2, minWidth: 0, fontSize: 12.5, padding: '8px' }} />
            <NumInput value={x.q} placeholder="cant." onChange={(v) => setIng(i, { q: v })} className="font-body inp" style={{ flex: 1, minWidth: 0, fontSize: 12.5, padding: '8px' }} />
            <input type="text" value={x.u} placeholder="ud." onChange={(e) => setIng(i, { u: e.target.value })} className="font-body inp" style={{ flex: 0.8, minWidth: 0, fontSize: 12.5, padding: '8px' }} />
            <MiniBtn onClick={() => upd({ ingredientes: r.ingredientes.filter((_, k) => k !== i) })}>✕</MiniBtn>
          </div>
        ))}
        <button onClick={() => upd({ ingredientes: r.ingredientes.concat([{ n: '', q: null, u: 'g' }]) })} className="font-body btn btn-ghost" style={{ width: '100%', padding: '8px', fontSize: 12, marginBottom: 12 }}>➕ Añadir ingrediente</button>
        <Label>Pasos (uno por línea)</Label>
        <textarea value={pasosTxt} onChange={(e) => setPasosTxt(e.target.value)} rows={5} className="font-body inp" style={{ fontSize: 13, lineHeight: 1.5 }} />
        <button disabled={!r.nombre.trim()} onClick={guardar} className="font-body btn btn-primary" style={{ width: '100%', marginTop: 16 }}>Guardar receta</button>
      </Card>
    </Modal>
  );
}

    commit((prev) => ({ ...prev, comida: { ...prev.comida, diario: { ...prev.comida.diario, [fecha]: (prev.comida.diario[fecha] || []).concat([{ id: uid(), momento, nombre: receta.nombre, recetaId: receta.id, raciones: rac, por: recTotals(receta, 1), ...t }]) } } }));
    showToast('Añadido al diario ✓'); setDestino(null);
  };
  const aPlan = () => {
    commit((prev) => {
      const plan = { ...prev.comida.plan };

        <div className="font-body" style={{ color: T.text, fontWeight: 800, fontSize: 13.5, margin: '14px 0 6px' }}>Preparación</div>
        {receta.pasos.length === 0 && <div className="font-body" style={{ color: T.dim, fontSize: 12 }}>Sin pasos escritos.</div>}
        {receta.pasos.map((p, i) => <div key={i} className="font-body" style={{ color: T.muted, fontSize: 12.5, lineHeight: 1.55, marginBottom: 6 }}><b style={{ color: ACCENT }}>{i + 1}.</b> {p}</div>)}
      </Card>

      {!destino ? (

          <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>

function toggleFavorita(commit, id) {
  commit((prev) => {
    const fav = prev.comida.favoritos || [];
    return { ...prev, comida: { ...prev.comida, favoritos: fav.indexOf(id) !== -1 ? fav.filter((x) => x !== id) : fav.concat([id]) } };
  });
}

/* ---------- Planificador semanal ---------- */

function PlanSec() {
  const { state, commit, showToast } = useGym();
  const { plan: obj } = effNutri(state);
  const [pick, setPick] = useState(null); // {dia, momento}
  const rec = (id) => state.comida.recetas.find((r) => r.id === id);
  const diaPlan = (i) => ({ desayuno: [], comida: [], cena: [], snack: [], ...(state.comida.plan[i] || {}) });
  const totDia = (i) => { const d = diaPlan(i); let t = { kcal: 0, p: 0, c: 0, g: 0 }; MOMENTOS.forEach((m) => d[m[0]].forEach((it) => { const r = rec(it.recetaId); if (r) { const x = recTotals(r, it.raciones); t = { kcal: t.kcal + x.kcal, p: t.p + x.p, c: t.c + x.c, g: t.g + x.g }; } })); return t; };
  const add = (dia, momento, r, rac) => commit((prev) => { const plan = { ...prev.comida.plan }; const d = { ...diaPlan(dia) }; d[momento] = d[momento].concat([{ id: uid(), recetaId: r.id, raciones: rac }]); plan[dia] = d; return { ...prev, comida: { ...prev.comida, plan } }; });
  const del = (dia, momento, id) => commit((prev) => { const plan = { ...prev.comida.plan }; const d = { ...diaPlan(dia) }; d[momento] = d[momento].filter((x) => x.id !== id); plan[dia] = d; return { ...prev, comida: { ...prev.comida, plan } }; });
  const aDiario = (i) => {
    const hoy = ymd(new Date()); const d = diaPlan(i); const nuevos = [];
    MOMENTOS.forEach((m) => d[m[0]].forEach((it) => { const r = rec(it.recetaId); if (r) nuevos.push({ id: uid(), momento: m[0], nombre: r.nombre, recetaId: r.id, raciones: it.raciones, por: recTotals(r, 1), ...recTotals(r, it.raciones) }); }));
    if (!nuevos.length) { showToast('Ese día no tiene comidas planificadas', 'warn'); return; }
    commit((prev) => ({ ...prev, comida: { ...prev.comida, diario: { ...prev.comida.diario, [hoy]: (prev.comida.diario[hoy] || []).concat(nuevos) } } }));
    showToast('Añadido al diario de hoy ✓');
  };

  return (
    <div>
      <div className="font-body" style={{ color: T.muted, fontSize: 12, lineHeight: 1.5, marginBottom: 12 }}>Planifica una semana tipo. Con ella se genera la lista de la compra.</div>
      {DIAS_SEMANA.map((nombre, i) => {
        const d = diaPlan(i); const t = totDia(i);
        const hay = MOMENTOS.some((m) => d[m[0]].length);
        return (
          <Card key={nombre} style={{ marginBottom: 10 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
              <div className="font-body" style={{ color: T.text, fontWeight: 800, fontSize: 14 }}>{nombre}</div>
              {hay && <MacroLine t={t} small />}
            </div>
            {hay && !obj.falta && <div className="font-body" style={{ color: T.dim, fontSize: 11, marginBottom: 6 }}>Objetivo {obj.kcal} kcal · {t.kcal - obj.kcal >= 0 ? 'te pasas ' + Math.round(t.kcal - obj.kcal) : 'faltan ' + Math.round(obj.kcal - t.kcal)} kcal</div>}
            {MOMENTOS.map((m) => (
              <div key={m[0]} style={{ borderTop: '1px solid rgba(140,170,255,0.12)', padding: '7px 0' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span className="font-body" style={{ color: T.muted, fontSize: 12 }}>{m[1]}</span>
                  <MiniBtn title="Añadir" onClick={() => setPick({ dia: i, momento: m[0] })}>+</MiniBtn>
                </div>
                {d[m[0]].map((it) => {
                  const r = rec(it.recetaId);
                  return (
                    <div key={it.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, marginTop: 4 }}>
                      <div className="font-body" style={{ color: r ? T.text : T.dim, fontSize: 12.5, minWidth: 0 }}>{r ? r.nombre : 'Receta eliminada'} × {fmt(it.raciones, 2)}</div>
                      <MiniBtn title="Quitar" onClick={() => del(i, m[0], it.id)}>✕</MiniBtn>
                    </div>
                  );
                })}
              </div>
            ))}
            {hay && <button onClick={() => aDiario(i)} className="font-body btn btn-ghost" style={{ width: '100%', marginTop: 8, padding: '8px', fontSize: 12 }}>📓 Pasar este día al diario de hoy</button>}
          </Card>
        );
      })}
      {pick && <PickRecetaModal titulo={DIAS_SEMANA[pick.dia] + ' · ' + pick.momento} tipoInicial={pick.momento} onPick={(r, rac) => add(pick.dia, pick.momento, r, rac)} onClose={() => setPick(null)} />}
    </div>
  );
}

/* ---------- Lista de la compra ---------- */

function listaCompra(state) {
  const map = {};
  const plan = state.comida.plan || {};
  Object.keys(plan).forEach((di) => MOMENTOS.forEach((m) => (plan[di][m[0]] || []).forEach((it) => {
    const r = state.comida.recetas.find((x) => x.id === it.recetaId);
    if (!r) return;
    r.ingredientes.forEach((ing) => {
      const key = stripAcc(ing.n).toLowerCase().trim() + '|' + String(ing.u || '').toLowerCase();
      const cur = map[key] || (map[key] = { key, nombre: ing.n, u: ing.u, q: 0, sinCantidad: false });
      if (ing.q === null || ing.q === undefined || ing.q === '') cur.sinCantidad = true; else cur.q += Number(ing.q) * it.raciones;
    });
  })));
  return Object.keys(map).map((k) => map[k]).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
}

function CompraSec() {
  const { state, commit, showToast } = useGym();
  const items = useMemo(() => listaCompra(state), [state.comida.plan, state.comida.recetas]);
  const marcados = state.comida.compra || {};
  const toggle = (key) => commit((prev) => ({ ...prev, comida: { ...prev.comida, compra: { ...prev.comida.compra, [key]: !prev.comida.compra[key] } } }), { noUndo: true });
  const texto = () => 'Lista de la compra\n' + items.filter((x) => !marcados[x.key]).map((x) => '• ' + x.nombre + ' — ' + (x.q ? fmt(x.q, 1) + ' ' + (x.u || '') : x.u || '')).join('\n');
  const pendientes = items.filter((x) => !marcados[x.key]).length;

  if (!items.length) return <Card><div className="font-body" style={{ color: T.muted, fontSize: 13, textAlign: 'center', lineHeight: 1.5 }}>Todavía no hay nada planificado. Añade recetas en el planificador y aquí aparecerá la lista de la compra.</div></Card>;
  return (
    <div>
      <div className="font-body" style={{ color: T.muted, fontSize: 12, marginBottom: 10 }}>{pendientes} por comprar de {items.length}</div>
      <Card style={{ marginBottom: 12 }}>
        {items.map((x) => (
          <div key={x.key} onClick={() => toggle(x.key)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 0', borderTop: '1px solid rgba(140,170,255,0.1)', cursor: 'pointer' }}>
            <span style={{ width: 22, height: 22, borderRadius: 7, border: '2px solid ' + (marcados[x.key] ? '#A3E635' : 'rgba(140,170,255,0.5)'), background: marcados[x.key] ? '#A3E635' : 'transparent', color: '#04101C', fontWeight: 900, fontSize: 14, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{marcados[x.key] ? '✓' : ''}</span>
            <span className="font-body" style={{ flex: 1, color: marcados[x.key] ? T.dim : T.text, fontSize: 13.5, textDecoration: marcados[x.key] ? 'line-through' : 'none' }}>{x.nombre}</span>
            <span className="font-body" style={{ color: T.muted, fontSize: 12.5, fontWeight: 700 }}>{x.q ? fmt(x.q, 1) + ' ' + (x.u || '') : x.u}</span>
          </div>
        ))}
      </Card>
      <div style={{ display: 'flex', gap: 8 }}>
        <button onClick={() => commit((prev) => ({ ...prev, comida: { ...prev.comida, compra: {} } }), { noUndo: true })} className="font-body btn btn-ghost" style={{ flex: 1, fontSize: 12.5 }}>Limpiar marcas</button>
        <button onClick={() => { if (!Native.share({ title: 'Lista de la compra', text: texto(), filename: 'lista_compra.txt', mime: 'text/plain;charset=utf-8' })) { toastResult(showToast, copyText(texto()), 'Lista copiada ✓', 'No se pudo compartir'); } }} className="font-body btn btn-primary" style={{ flex: 1, fontSize: 12.5 }}>📤 Compartir lista</button>
      </div>
    </div>
  );
}

/* ---------- Agua (en litros; una botella de 1 L = 1) ---------- */

function AguaSec() {
  const { state, commit } = useGym();
  const ag = state.comida.agua;
  const hoy = ymd(new Date());
  const n = ag.dias[hoy] || 0;
  const r2 = (v) => Math.round(v * 100) / 100;
  const set = (v) => commit((prev) => ({ ...prev, comida: { ...prev.comida, agua: { ...prev.comida.agua, dias: { ...prev.comida.agua.dias, [hoy]: Math.max(0, r2(v)) } } } }), { key: 'agua' });
  const meta = (v) => commit((prev) => ({ ...prev, comida: { ...prev.comida, agua: { ...prev.comida.agua, objetivo: v } } }));
  const ult = [];
  for (let i = 6; i >= 0; i--) { const k = ymd(addDays(new Date(), -i)); ult.push({ k, v: ag.dias[k] || 0 }); }
  const maxV = Math.max(ag.objetivo, ...ult.map((u) => u.v), 1);
  const botellas = Math.min(12, Math.max(Math.ceil(ag.objetivo), Math.ceil(n)));
  return (
    <div>
      <Card style={{ marginBottom: 14, textAlign: 'center' }}>
        <div className="font-body" style={{ color: T.dim, fontSize: 11.5 }}>Hoy</div>
        <div className="font-display" style={{ color: n >= ag.objetivo ? '#A3E635' : '#FFFFFF', fontSize: 46, fontWeight: 700, lineHeight: 1.05 }}>{fmt(n, 2)} / {fmt(ag.objetivo, 2)} L</div>
        <div className="font-body" style={{ color: T.muted, fontSize: 12, marginBottom: 12 }}>
          {fmt(n, 2)} {n === 1 ? 'botella' : 'botellas'} de 1 L {n >= ag.objetivo ? '· ¡objetivo cumplido! 💧' : '· te faltan ' + fmt(Math.max(0, r2(ag.objetivo - n)), 2) + ' L'}
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, justifyContent: 'center', marginBottom: 14 }}>
          {Array.from({ length: botellas }).map((_, i) => {
            const nivel = Math.max(0, Math.min(1, n - i));
            return (
              <span key={i} onClick={() => set(nivel >= 1 ? i : i + 1)} title={'Botella ' + (i + 1)} style={{ position: 'relative', width: 44, height: 62, borderRadius: 12, overflow: 'hidden', cursor: 'pointer', border: '1.5px solid ' + (nivel > 0 ? ACCENT : 'rgba(140,170,255,0.35)'), background: 'rgba(255,255,255,0.05)' }}>
                <span style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: nivel * 100 + '%', background: 'linear-gradient(180deg, rgba(34,211,238,0.55), rgba(56,189,248,0.85))' }} />
                <span className="font-body" style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11.5, fontWeight: 800, color: '#FFFFFF', textShadow: '0 1px 3px rgba(0,0,0,0.7)' }}>{i + 1} L</span>
              </span>
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button disabled={n <= 0} onClick={() => set(n - 0.5)} className="font-body btn btn-ghost" style={{ flex: 1, fontSize: 12.5 }}>➖ 0,5 L</button>
          <button onClick={() => set(n + 0.5)} className="font-body btn btn-ghost" style={{ flex: 1, fontSize: 12.5 }}>➕ 0,5 L</button>
          <button onClick={() => set(n + 1)} className="font-body btn btn-primary" style={{ flex: 1.4, fontSize: 12.5 }}>🍼 +1 L (botella)</button>
        </div>
        <div style={{ marginTop: 12, textAlign: 'left' }}>
          <LabeledNum label="Corregir el total de hoy (litros, por ejemplo 2,5)" suffix="L" value={n} onChange={(v) => set(v === null ? 0 : v)} />
        </div>
      </Card>
      <Card style={{ marginBottom: 14 }}>
        <Label>Objetivo diario (litros)</Label>
        <Stepper value={ag.objetivo} onChange={meta} min={1} max={10} step={0.5} suffix="L" />
      </Card>
      <Card>
        <div className="font-body" style={{ color: T.text, fontWeight: 700, fontSize: 13, marginBottom: 10 }}>Últimos 7 días (litros)</div>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, height: 96 }}>
          {ult.map((u) => (
            <div key={u.k} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', height: '100%' }}>
              <div className="font-body" style={{ color: T.dim, fontSize: 10, marginBottom: 2 }}>{u.v ? fmt(u.v, 1) : ''}</div>
              <div style={{ width: '100%', height: Math.max(3, (u.v / maxV) * 60) + 'px', borderRadius: 6, background: u.v >= ag.objetivo ? '#A3E635' : u.v ? 'linear-gradient(180deg, #22D3EE, #818CF8)' : 'rgba(255,255,255,0.08)' }} />
              <div className="font-body" style={{ color: T.dim, fontSize: 10, marginTop: 3 }}>{DIAS_SEMANA[(fromYmd(u.k).getDay() + 6) % 7].slice(0, 1)}</div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ---------- Herramientas: 1RM y discos ---------- */

// 1RM estimado: media de Epley y Brzycki. Devuelve null si los datos no valen (reps entre 1 y 30).
const TABLA_1RM = [[100, 1], [95, 2], [90, 4], [85, 6], [80, 8], [75, 10], [70, 12], [65, 15], [60, 20]];
function calc1RM(peso, reps) {
  if (typeof peso !== 'number' || typeof reps !== 'number' || !(peso > 0) || !(reps >= 1) || reps > 30) return null;
  const epley = reps === 1 ? peso : peso * (1 + reps / 30);
  const brzycki = reps === 1 ? peso : (peso * 36) / (37 - reps);
  const media = (epley + brzycki) / 2;
  return {
    epley, brzycki, media, min: Math.min(epley, brzycki), max: Math.max(epley, brzycki),
    tabla: TABLA_1RM.map((t) => ({ pct: t[0], reps: t[1], kg: (media * t[0]) / 100 })),
  };
}

// Discos por lado. barra = peso de la barra (0 para máquinas: solo cuentan los discos).
// Devuelve null si no hay objetivo, { menor: true } si el objetivo es menor que la barra,
// o { usados: [[disco, cantidad]…], resto (kg por lado sin cubrir), enDiscos (kg totales en discos), montado (kg totales reales) }.
const DISCOS_KG = [25, 20, 15, 10, 5, 2.5, 1.25];
function calcDiscos(barra, objetivo, discos) {
  const lista = discos || DISCOS_KG;
  if (typeof objetivo !== 'number' || !(objetivo > 0)) return null;
  const b = typeof barra === 'number' && barra > 0 ? barra : 0;
  if (objetivo < b) return { menor: true };
  let resto = (objetivo - b) / 2;
  const usados = [];
  lista.forEach((d) => { const n = Math.floor((resto + 1e-9) / d); if (n > 0) { usados.push([d, n]); resto = Math.round((resto - n * d) * 1000) / 1000; } });
  const enDiscos = Math.round(usados.reduce((a, u) => a + u[0] * u[1], 0) * 2 * 1000) / 1000;
  return { usados, resto, enDiscos, montado: Math.round((b + enDiscos) * 1000) / 1000 };
}

            <div className="font-body" style={{ color: T.dim, fontSize: 11.5 }}>{'Entre ' + fmt(r.min) + ' y ' + fmt(r.max) + ' kg según el método de cálculo'}</div>
          </div>
          <div className="font-body" style={{ color: T.text, fontWeight: 700, fontSize: 12.5, margin: '8px 0 4px' }}>Qué peso usar según el porcentaje de tu máximo</div>
          {r.tabla.map((t) => <SupRow key={t.pct} label={t.pct + ' % del máximo (unas ' + t.reps + (t.reps === 1 ? ' repetición)' : ' repeticiones)')} value={fmt(t.kg) + ' kg'} />)}
          <div className="font-body" style={{ color: T.dim, fontSize: 11, lineHeight: 1.5, marginTop: 8 }}>El 1RM es el peso máximo que podrías levantar una sola vez. Se estima a partir de una serie con menos repeticiones y es más fiable con 10 repeticiones o menos. Es la media de dos fórmulas conocidas (Epley y Brzycki).</div>
        </div>

    </Card>
  );
}

const BACKUP_KEY = 'gymtracker_backup_import_v1';
// Copias de rescate: si al arrancar hay datos guardados que no se pueden leer o migrar, se copian aquí
// ANTES de que la app escriba nada encima, para que nunca se pierdan (se pueden descargar desde Ajustes).
const RECOVERY_PREFIX = 'gymtracker_rescate_';
const RECOVERY_MAX = 3;
let RESCUE_SEQ = 0;

function listRescueKeys() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(RECOVERY_PREFIX) === 0) out.push(k);
    }
  } catch (e) { /* almacenamiento no accesible */ }
  return out.sort();
}

// Guarda una copia del texto original. tipo: 'ilegible' | 'premigracion_vN' | 'error'. Devuelve la clave o null.
function saveRescue(raw, tipo) {
  if (raw === null || raw === undefined || raw === '') return null;
  try {
    RESCUE_SEQ = (RESCUE_SEQ + 1) % 1000;
    const key = RECOVERY_PREFIX + Date.now() + '_' + String(RESCUE_SEQ).padStart(3, '0') + '_' + tipo;
    localStorage.setItem(key, typeof raw === 'string' ? raw : JSON.stringify(raw));
    const keys = listRescueKeys();
    while (keys.length > RECOVERY_MAX) { localStorage.removeItem(keys.shift()); }
    return key;
  } catch (e) { return null; }
}

// Estado inicial: lo guardado (Native.loadState) y, si no hay nada, la rutina por defecto.
// Devuelve { state, aviso }. NUNCA descarta datos guardados sin copiarlos antes a una copia de rescate.
function readInitialState() {
  let saved = null;
  try {
    saved = Native.loadState();
  } catch (e) {
    if (e && e.inaccesible) return { state: buildInitialState(), aviso: 'No se puede acceder al almacenamiento: los cambios no se guardarán en este navegador.', sinGuardar: true };
    const k = saveRescue(e && e.raw, 'ilegible');
    return { state: buildInitialState(), aviso: k ? 'Tus datos guardados estaban dañados. Se ha guardado una copia de rescate (Ajustes → Copias de rescate) y se ha empezado de nuevo.' : 'Tus datos guardados estaban dañados y no se pudo hacer copia: NO se ha escrito nada encima. Exporta lo que puedas antes de seguir.', sinGuardar: !k };
  }
  if (saved === null) return { state: buildInitialState() };
  if (typeof saved !== 'object' || Array.isArray(saved) || !saved.exercises || typeof saved.exercises !== 'object') {
    const k = saveRescue(JSON.stringify(saved), 'ilegible');
    return { state: buildInitialState(), aviso: 'Tus datos guardados no tenían el formato esperado. Se ha guardado una copia de rescate (Ajustes → Copias de rescate).', sinGuardar: !k };
  }
  try {
    const v = Number(saved.version);
    // Antes de convertir datos de otra versión se guarda el original, por si la conversión saliera mal
    if (v !== APP_VERSION) saveRescue(JSON.stringify(saved), 'premigracion_v' + (isFinite(v) ? v : 0));
    return { state: migrateState(saved) };
  } catch (e) {
    const k = saveRescue(JSON.stringify(saved), 'error');
    return { state: buildInitialState(), aviso: 'No se pudieron convertir tus datos guardados. Hay una copia de rescate en Ajustes → Copias de rescate.', sinGuardar: !k };
  }
}

   TEMPORIZADOR DE DESCANSO (cuenta con la hora real, Date.now)
   Al acabar: Native.vibrate + Native.beep. Con la app en segundo plano o la pantalla apagada,

function fmtMS(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ':' + pad2(s % 60);
}

  return (
    <Modal title="⏱️ Descanso entre series" onClose={onClose}>
      <Card style={{ textAlign: 'center' }}>
        {timer ? (
          <div>
            <div className="font-display" style={{ color: '#FFFFFF', fontSize: 76, fontWeight: 700, lineHeight: 1 }}>{fmtMS(resta)}</div>
            <div style={{ margin: '12px 0' }}><Bar pct={(resta / (timer.total * 1000)) * 100} color={ACCENT} height={12} /></div>
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <button onClick={() => addTimer(-15)} className="font-body btn btn-ghost" style={{ flex: 1 }}>−15 s</button>
              <button onClick={() => addTimer(15)} className="font-body btn btn-ghost" style={{ flex: 1 }}>+15 s</button>
              <button onClick={stopTimer} className="font-body btn btn-danger" style={{ flex: 1 }}>Parar</button>
            </div>
            <button onClick={onClose} className="font-body btn btn-primary" style={{ width: '100%', marginTop: 12 }}>Seguir entrenando (sigue contando)</button>
          </div>
        ) : (
          <div>
            <div className="font-body" style={{ color: T.muted, fontSize: 12.5, marginBottom: 12 }}>Elige cuánto vas a descansar y toca para empezar:</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
              {presets.map((s) => (
                <button key={s} onClick={() => startTimer(s)} className="font-body btn btn-primary" style={{ fontSize: 14, padding: '14px 4px' }}>{etiqueta(s)}</button>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', marginTop: 14 }}>
              <LabeledNum label="Otro tiempo (segundos, de 10 a 600)" suffix="s" value={custom} onChange={setCustom} />
              <button disabled={!custom || custom < 10 || custom > 600} onClick={() => startTimer(Math.round(custom))} className="font-body btn btn-primary" style={{ flexShrink: 0 }}>Empezar</button>
            </div>
          </div>
        )}
        <div className="font-body" style={{ color: T.dim, fontSize: 11, lineHeight: 1.5, marginTop: 16, textAlign: 'left' }}>
          {timer && timer.notifOk
            ? 'Aviso programado: te avisará aunque apagues la pantalla o dejes la app en segundo plano.'
            : 'Esta versión solo vibra y suena si la app está abierta. El aviso con la pantalla apagada o la app en segundo plano necesita la APK (la función Native.scheduleNotification).'}
          {' '}El tiempo se calcula con la hora real, así que no se descuadra.
        </div>
      </Card>
    </Modal>
  );
}

function App() {
  const [state, setState] = useState(null);
  const [toast, setToast] = useState(null);
  const [screen, setScreen] = useState('main');
  const [confirmDlg, setConfirmDlg] = useState(null);
  const [fotos, setFotosState] = useState(() => loadFotos());
  const [hasBackup, setHasBackup] = useState(() => { try { return !!localStorage.getItem(BACKUP_KEY); } catch (e) { return false; } });
  const [timer, setTimer] = useState(null);
  const [timerOpen, setTimerOpen] = useState(false);
  const [nowMs, setNowMs] = useState(Date.now());
  const timerRef = useRef(null);
  const backupRef = useRef(null);
  const saveTimer = useRef(null);
  const stateRef = useRef(null);
  const warnedRef = useRef(false);
  const histRef = useRef({ undo: [], redo: [], lastKey: null, lastT: 0 });
  const [, setHistTick] = useState(0); // fuerza que ↩/↪ se repinten al cambiar la pila de deshacer
  const bumpHist = () => setHistTick((n) => n + 1);
  const fotosRef = useRef(fotos);
  const noSaveRef = useRef(false); // true si al arrancar no se pudo rescatar lo guardado: no se escribe encima
  const toastTimer = useRef(null);
  useEffect(() => { stateRef.current = state; }, [state]);

  const showToast = useCallback((msg, kind, ms) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, kind });
    toastTimer.current = setTimeout(() => { toastTimer.current = null; setToast(null); }, ms || 2800);
  }, []);
  const askConfirm = useCallback((opts) => setConfirmDlg(opts), []);

  /* ---------- guardado ---------- */
  const writeOut = useCallback((data) => {
    if (noSaveRef.current) return;
    const ok = Native.saveState(data);
    if (!ok && !warnedRef.current) { warnedRef.current = true; showToast('No se pudo guardar: el almacenamiento está lleno o bloqueado', 'warn'); }
  }, [showToast]);

  useEffect(() => {
    const res = readInitialState();
    const initial = res.state;
    noSaveRef.current = !!res.sinGuardar;
    stateRef.current = initial;
    setState(initial);
    if (PENDING_PHOTOS) { const m = { ...loadFotos(), ...PENDING_PHOTOS }; if (saveFotos(m)) { fotosRef.current = m; setFotosState(m); } PENDING_PHOTOS = null; }
    writeOut(initial);
    if (res.aviso) showToast(res.aviso, 'warn', 9000);
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const scheduleSave = useCallback(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => { saveTimer.current = null; if (stateRef.current) writeOut(stateRef.current); }, 250);
  }, [writeOut]);

  // Al salir de la app o minimizarla se guarda al instante, sin esperar al temporizador
  useEffect(() => {
    const flush = () => {
      if (saveTimer.current) { clearTimeout(saveTimer.current); saveTimer.current = null; }
      if (stateRef.current) writeOut(stateRef.current);
    };
    const onVis = () => { if (document.visibilityState === 'hidden') flush(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('pagehide', flush);
    return () => { document.removeEventListener('visibilitychange', onVis); window.removeEventListener('pagehide', flush); };
  }, [writeOut]);

  const persistNow = useCallback((next) => {
    if (saveTimer.current) { clearTimeout(saveTimer.current); saveTimer.current = null; }
    stateRef.current = next;
    writeOut(next);
  }, [writeOut]);

  /* ---------- deshacer / rehacer (pila de 30; agrupa ediciones seguidas del mismo campo) ---------- */
  const pushUndo = (prev, key) => {
    const h = histRef.current;
    const now = Date.now();
    if (key && key === h.lastKey && now - h.lastT < 2500) { h.lastT = now; return; }
    h.undo.push(prev);
    if (h.undo.length > 30) h.undo.shift();
    h.redo = [];
    h.lastKey = key || null; h.lastT = now;
  };
  const clearHist = () => { histRef.current = { undo: [], redo: [], lastKey: null, lastT: 0 }; bumpHist(); };

  // Aplica un cambio al estado. opts: { key } agrupa el tecleo de un mismo campo; { noUndo } no entra en la pila (navegación…)
  // El siguiente estado se calcula FUERA del actualizador de React a partir de stateRef (que siempre tiene el último
  // estado, porque todas las vías que cambian el estado lo actualizan a la vez). Así el actualizador no tiene efectos
  // secundarios: en React 18 un actualizador puede ejecutarse dos veces y antes eso metía dos veces el mismo paso en la pila.
  const commit = useCallback((fn, opts) => {
    const o = opts || {};
    const prev = stateRef.current;
    if (!prev) return false;
    const next = fn(prev);
    if (!next || next === prev) return false;
    if (!o.noUndo) { pushUndo(prev, o.key); bumpHist(); }
    stateRef.current = next;
    setState(next);
    scheduleSave();
    return true;
  }, [scheduleSave]);

  const undo = useCallback(() => {
    const h = histRef.current; const cur = stateRef.current;
    if (!h.undo.length || !cur) return;
    const snap = h.undo.pop();
    h.redo.push(cur); h.lastKey = null;
    const next = { ...snap, meta: cur.meta };
    stateRef.current = next; setState(next); bumpHist(); scheduleSave(); showToast('↩️ Deshecho');
  }, [scheduleSave, showToast]);
  const redo = useCallback(() => {
    const h = histRef.current; const cur = stateRef.current;
    if (!h.redo.length || !cur) return;
    const snap = h.redo.pop();
    h.undo.push(cur); h.lastKey = null;
    const next = { ...snap, meta: cur.meta };
    stateRef.current = next; setState(next); bumpHist(); scheduleSave(); showToast('↪️ Rehecho');
  }, [scheduleSave, showToast]);

  /* ---------- fotos (almacén aparte, fuera del estado principal) ---------- */
  // Las fotos solo se muestran si se han podido guardar (si no, al reabrir la app habrían desaparecido)
  const setFoto = useCallback((id, url) => {
    const m = { ...fotosRef.current, [id]: url };
    if (!saveFotos(m)) { showToast('No se pudo guardar la foto: almacenamiento lleno o bloqueado', 'warn'); return; }
    fotosRef.current = m; setFotosState(m);
  }, [showToast]);
  const delFoto = useCallback((id) => {
    const m = { ...fotosRef.current }; delete m[id];
    if (!saveFotos(m)) { showToast('No se pudo quitar la foto: almacenamiento bloqueado', 'warn'); return; }
    fotosRef.current = m; setFotosState(m);
  }, [showToast]);

  /* ---------- acciones de la rutina ---------- */
  const updateExercise = useCallback((id, patch, key) => {
    commit((prev) => (prev.exercises[id] ? { ...prev, exercises: { ...prev.exercises, [id]: { ...prev.exercises[id], ...patch } } } : prev), { key });
  }, [commit]);
  const updateCardio = useCallback((id, patch, key) => {
    commit((prev) => ({ ...prev, cardio: prev.cardio.map((c) => (c.id === id ? { ...c, ...patch } : c)) }), { key });
  }, [commit]);
  const addCardio = useCallback(() => {
    commit((prev) => ({ ...prev, cardio: prev.cardio.concat([{ id: 'cardio_' + uid(), name: 'Nuevo cardio', frecuencia: '', detalle: '' }]) }));
  }, [commit]);
  const removeCardio = useCallback((id) => {
    commit((prev) => ({ ...prev, cardio: prev.cardio.filter((c) => c.id !== id) }));
    showToast('Cardio quitado');
  }, [commit, showToast]);

  const addExercise = useCallback((dayId, name, cat) => {
    commit((prev) => {
      const newId = 'custom_' + uid();
      const newEx = normalizeExercise({ name, cat, comentario: '', currentSets: [normalizeSet({}, 0), normalizeSet({}, 1)], history: [] });
      return { ...prev, exercises: { ...prev.exercises, [newId]: newEx }, days: prev.days.map((d) => (d.id === dayId ? { ...d, ids: d.ids.concat([newId]) } : d)) };
    });
  }, [commit]);
  const removeFromDay = useCallback((dayId, exId) => {
    commit((prev) => ({ ...prev, days: prev.days.map((d) => (d.id === dayId ? { ...d, ids: d.ids.filter((i) => i !== exId) } : d)) }));
    showToast('Ejercicio quitado (puedes deshacerlo)');
  }, [commit, showToast]);
  const moveExercise = useCallback((dayId, exId, dir) => {
    commit((prev) => ({
      ...prev,
      days: prev.days.map((d) => {
        if (d.id !== dayId) return d;
        const ids = d.ids.slice();
        const i = ids.indexOf(exId), j = i + dir;
        if (i === -1 || j < 0 || j >= ids.length) return d;
        const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
        return { ...d, ids };
      }),
    }));
  }, [commit]);
  const addSerie = useCallback((exId) => {
    commit((prev) => {
      const ex = prev.exercises[exId]; if (!ex || ex.currentSets.length >= 8) return prev;
      return { ...prev, exercises: { ...prev.exercises, [exId]: { ...ex, currentSets: ex.currentSets.concat([normalizeSet({ tipo: 'backoff' }, 1)]) } } };
    });
  }, [commit]);
  const removeSerieAt = useCallback((exId, idx) => {
    commit((prev) => {
      const ex = prev.exercises[exId]; if (!ex || ex.currentSets.length <= 1) return prev;
      return { ...prev, exercises: { ...prev.exercises, [exId]: { ...ex, currentSets: ex.currentSets.filter((_, i) => i !== idx) } } };
    });
  }, [commit]);

  const setActiveDay = useCallback((dayId) => { commit((prev) => ({ ...prev, meta: { ...prev.meta, activeDay: dayId } }), { noUndo: true }); }, [commit]);
  const setActiveTab = useCallback((tab) => { commit((prev) => ({ ...prev, meta: { ...prev.meta, activeTab: tab } }), { noUndo: true }); }, [commit]);
  const toggleEditMode = useCallback(() => { commit((prev) => ({ ...prev, meta: { ...prev.meta, editMode: !prev.meta.editMode } }), { noUndo: true }); }, [commit]);

  const updateDay = useCallback((dayId, patch, key) => {
    commit((prev) => ({ ...prev, days: prev.days.map((d) => (d.id === dayId ? { ...d, ...patch } : d)) }), { key });
  }, [commit]);
  const addDay = useCallback((label, equipo) => {
    const id = 'day_' + uid();
    commit((prev) => ({ ...prev, days: prev.days.concat([{ id, label, equipo: equipo || '', nota: '', ids: [] }]), meta: { ...prev.meta, activeDay: id } }));
    showToast('Día creado ✓');
  }, [commit, showToast]);
  const removeDay = useCallback((dayId) => {
    commit((prev) => {
      const i = prev.days.findIndex((d) => d.id === dayId);
      const days = prev.days.filter((d) => d.id !== dayId);
      let activeDay = prev.meta.activeDay;
      if (activeDay === dayId) activeDay = days.length ? days[Math.min(i, days.length - 1)].id : null;
      return { ...prev, days, meta: { ...prev.meta, activeDay } };
    });
    showToast('Día eliminado (puedes deshacerlo)');
  }, [commit, showToast]);
  const moveDay = useCallback((dayId, dir) => {
    commit((prev) => {
      const days = prev.days.slice();
      const i = days.findIndex((d) => d.id === dayId), j = i + dir;
      if (i === -1 || j < 0 || j >= days.length) return prev;
      const tmp = days[i]; days[i] = days[j]; days[j] = tmp;
      return { ...prev, days };
    });
  }, [commit]);

  /* ---------- registro del día, peso, ajustes ---------- */
  const saveEntry = useCallback((id) => {
    const prev = stateRef.current; const ex = prev.exercises[id];
    if (!ex) return;
    const newEntry = { date: new Date().toISOString(), sets: clone(ex.currentSets) };
    const prevHistory = ex.history || [];
    const prevBest = prevHistory.reduce((m, h) => Math.max(m, computeScore(h.sets && h.sets[0])), 0);
    const newScore = computeScore(newEntry.sets[0]);
    const last = prevHistory.length ? prevHistory[prevHistory.length - 1] : null;
    const prevLatestScore = last ? computeScore(last.sets && last.sets[0]) : null;
    const isPR = newScore > 0 && newScore > prevBest;
    const isDown = prevLatestScore !== null && newScore > 0 && newScore < prevLatestScore;
    const next = { ...prev, exercises: { ...prev.exercises, [id]: { ...ex, history: prevHistory.concat([newEntry]) } } };
    clearHist(); // al guardar el registro del día la pila de deshacer se limpia
    setState(next); persistNow(next);
    if (isPR) showToast('🏆 ¡Nuevo récord en ' + ex.name + '!', 'pr');
    else if (isDown) showToast('Anotado — ha bajado un poco en ' + ex.name, 'warn');
    else showToast('Progreso guardado ✓');
  }, [persistNow, showToast]);

  const logPeso = useCallback((kg) => {
    const prevState = stateRef.current;
    const p = prevState.peso;
    let reached = false;
    if (p.objetivoKg && p.direccion && !p.objetivoAlcanzado) reached = p.direccion === 'bajar' ? kg <= p.objetivoKg : kg >= p.objetivoKg;
    commit((prev) => ({ ...prev, peso: { ...prev.peso, historial: prev.peso.historial.concat([{ id: uid(), date: new Date().toISOString(), kg }]), objetivoAlcanzado: prev.peso.objetivoAlcanzado || reached } }));
    showToast(reached ? '🏆 ¡Objetivo de peso alcanzado! ' + kg + ' kg' : 'Peso registrado ✓', reached ? 'pr' : undefined);
  }, [commit, showToast]);

  const guardarFormulario = useCallback((draft) => {
    commit((prev) => {
      const pesoHistorial = prev.peso.historial.length ? prev.peso.historial : [{ id: uid(), date: new Date().toISOString(), kg: draft.pesoInicialKg }];
      let direccion = null;
      if (draft.objetivoPesoKg) direccion = draft.pesoInicialKg > draft.objetivoPesoKg ? 'bajar' : draft.pesoInicialKg < draft.objetivoPesoKg ? 'subir' : null;
      const objetivoCambio = prev.peso.objetivoKg !== draft.objetivoPesoKg;
      return { ...prev, formulario: { ...prev.formulario, ...draft },
        peso: { ...prev.peso, historial: pesoHistorial, objetivoKg: draft.objetivoPesoKg, direccion, objetivoAlcanzado: objetivoCambio ? false : prev.peso.objetivoAlcanzado } };
    });
    showToast('Datos guardados ✓');
  }, [commit, showToast]);

  /* ---------- importar / restaurar / reiniciar (antes guardan una copia del estado anterior) ---------- */
  const backupPrev = (prev) => {
    backupRef.current = prev;
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(prev)); } catch (e) { /* sin espacio: queda solo en memoria */ }
    setHasBackup(true);
  };
  const replaceState = (next) => { clearHist(); stateRef.current = next; setState(next); persistNow(next); };

  const importObj = useCallback((obj, mode) => {
    const prev = stateRef.current;
    backupPrev(prev);
    replaceState(applyImport(prev, obj, mode));
    if (mode === 'todo' && obj.fotos) { const m = { ...loadFotos(), ...obj.fotos }; setFotosState(m); saveFotos(m); }
    showToast('Importación completada ✓');
  }, [persistNow, showToast]);
  const restoreBackup = useCallback(() => {
    let snap = backupRef.current;
    if (!snap) { try { snap = JSON.parse(localStorage.getItem(BACKUP_KEY)); } catch (e) { snap = null; } }
    if (!snap) { showToast('No hay copia anterior disponible', 'warn'); return; }
    replaceState(migrateState(snap));
    showToast('Estado anterior restaurado ✓');
  }, [persistNow, showToast]);
  const resetAll = useCallback(() => {
    backupPrev(stateRef.current);
    replaceState(buildInitialState());
    showToast('Datos restablecidos');
  }, [persistNow, showToast]);

  /* ---------- objetivos ---------- */
  const suggestObjetivo = useCallback((id) => {
    const ex = stateRef.current.exercises[id]; if (!ex) return;
    const record = bestSerie1(ex);
    if (record === null) { showToast('Necesitas un peso registrado en la serie 1 antes de sugerir un objetivo.', 'warn'); return; }
    const objetivoKg = Math.round(record * 1.125 * 2) / 2; // +12,5%, redondeado a 0,5 kg
    updateExercise(id, { objetivo: { text: fmt(objetivoKg, 2) + ' kg (sugerido, +12,5%)', value: objetivoKg, sugerido: true } });
    showToast('✅ Objetivo sugerido');
  }, [updateExercise, showToast]);
  const rellenarObjetivosFaltantes = useCallback(() => {
    let count = 0;
    commit((prev) => {
      const nextEx = { ...prev.exercises };
      activeExerciseIds(prev).forEach((id) => {
        const ex = nextEx[id];
        if (ex && !ex.objetivo) {
          const record = bestSerie1(ex);
          if (record !== null) { const o = Math.round(record * 1.125 * 2) / 2; nextEx[id] = { ...ex, objetivo: { text: fmt(o, 2) + ' kg (sugerido, +12,5%)', value: o, sugerido: true } }; count += 1; }
        }
      });
      return { ...prev, exercises: nextEx };
    });
    showToast(count > 0 ? '✅ ' + count + ' objetivo(s) rellenado(s)' : 'No hay ejercicios sin objetivo con marca registrada');
  }, [commit, showToast]);

  /* ---------- temporizador de descanso ---------- */
  const NOTIF = { id: 'descanso', title: '⏱️ Descanso terminado', body: 'Empieza la siguiente serie' };
  const startTimer = useCallback((sec) => {
    Native.unlockAudio(); // se llama dentro del toque: así el pitido final puede sonar en el móvil
    const end = Date.now() + sec * 1000;
    const r = Native.scheduleNotification({ ...NOTIF, at: end });
    const t = { end, total: sec, notifOk: !!(r && r.ok) };
    timerRef.current = t; setTimer(t); setNowMs(Date.now());
  }, []);
  const addTimer = useCallback((sec) => {
    const t = timerRef.current; if (!t) return;
    const end = t.end + sec * 1000;
    Native.cancelNotification(NOTIF.id);
    const r = Native.scheduleNotification({ ...NOTIF, at: end });
    const nt = { end, total: Math.max(5, t.total + sec), notifOk: !!(r && r.ok) };
    timerRef.current = nt; setTimer(nt);
  }, []);
  const stopTimer = useCallback(() => { Native.cancelNotification(NOTIF.id); timerRef.current = null; setTimer(null); }, []);
  useEffect(() => {
    if (!timer) return undefined;
    let done = false;
    const check = () => {
      const now = Date.now();
      setNowMs(now);
      const t = timerRef.current;
      if (!done && t && now >= t.end) {
        done = true;
        timerRef.current = null; setTimer(null); setTimerOpen(false);
        Native.vibrate(800);
        Native.beep();
        showToast('⏱️ ¡Descanso terminado! Empieza la siguiente serie', 'pr');
      }
    };
    const iv = setInterval(check, 250);
    const onVis = () => { if (document.visibilityState === 'visible') check(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
  }, [timer, showToast]);

  if (!state) {
    return <div style={{ background: T.bg, height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><div className="font-display" style={{ color: T.text, fontSize: 24, fontWeight: 700, letterSpacing: '0.06em' }}>CARGANDO TU RUTINA…</div></div>;
  }

  const h = histRef.current;
  const ctx = {
    state, commit, fotos, setFoto, delFoto, showToast, askConfirm,
    updateExercise, updateCardio, addCardio, removeCardio,
    setActiveDay, setActiveTab, toggleEditMode, updateDay, addDay, removeDay, moveDay,
    addExercise, removeFromDay, moveExercise, addSerie, removeSerieAt,
    saveEntry, logPeso, guardarFormulario, resetAll, importObj, restoreBackup, hasBackup,
    suggestObjetivo, rellenarObjetivosFaltantes,
  };

  const TABS = [
    { id: 'rutina', label: 'Rutina', emoji: '🏋️' },
    { id: 'cardio', label: 'Cardio', emoji: '🏃' },
    { id: 'progreso', label: 'Progreso', emoji: '📊' },
    { id: 'fisico', label: 'Diana', emoji: '🎯' },
    { id: 'comida', label: 'Comida', emoji: '🍽️' },
    { id: 'extras', label: 'Extras', emoji: '✨' },
  ];
  const tab = state.meta.activeTab;

  return (
    <GymContext.Provider value={ctx}>
      <GlobalStyle />
      <div style={{ height: '100%', maxWidth: 460, margin: '0 auto', position: 'relative', display: 'flex', flexDirection: 'column', overflow: 'hidden' }} className="font-body">
        <div style={{ position: 'absolute', inset: 0, zIndex: 0, backgroundImage: 'linear-gradient(to bottom, rgba(6,9,19,0.50), rgba(6,9,19,0.90) 55%, #060913 94%), url(' + BG_IMAGE + ')', backgroundSize: 'cover', backgroundPosition: 'center 35%' }} />
        <div className="bg-grid" style={{ position: 'absolute', inset: 0, zIndex: 0, pointerEvents: 'none' }} />

        <Toast toast={toast} />
        <ConfirmDialog dlg={confirmDlg} onClose={() => setConfirmDlg(null)} />
        {timerOpen && <TimerModal timer={timer} nowMs={nowMs} startTimer={startTimer} addTimer={addTimer} stopTimer={stopTimer} onClose={() => setTimerOpen(false)} />}

        {screen === 'settings' ? (
          <div className="gt-scroll" style={{ position: 'relative', zIndex: 1, overflowY: 'auto', flex: 1 }}>
            <div style={{ padding: '14px 16px 0', display: 'flex', justifyContent: 'flex-end' }}>
              <button onClick={() => setScreen('main')} className="font-body btn btn-ghost" style={{ padding: '8px 12px', borderStyle: 'solid' }}>✕ Cerrar</button>
            </div>
            <AjustesScreen onClose={() => setScreen('main')} />
          </div>
        ) : (
          <>
            <div style={{ position: 'relative', zIndex: 1, padding: '14px 14px 6px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0, gap: 8 }}>
              <div className="font-display" style={{ fontSize: 'clamp(19px, 6.4vw, 26px)', fontWeight: 700, letterSpacing: '0.07em', color: '#FFFFFF', textShadow: '0 0 14px rgba(34,211,238,0.55)', whiteSpace: 'nowrap', minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis' }}>MI RUTINA 💪</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
                <button onClick={() => setTimerOpen(true)} title="Descanso entre series" className="font-body hbtn" style={timer ? { width: 'auto', padding: '0 8px', fontSize: 12, borderColor: ACCENT, color: '#FFFFFF' } : undefined}>⏱️{timer ? ' ' + fmtMS(timer.end - nowMs) : ''}</button>
                <button onClick={undo} disabled={!h.undo.length} title="Deshacer" className="font-body hbtn">↩</button>
                <button onClick={redo} disabled={!h.redo.length} title="Rehacer" className="font-body hbtn">↪</button>
                <button onClick={() => setScreen('settings')} title="Ajustes" className="font-body hbtn">⚙️</button>
              </div>
            </div>

            <div className="gt-scroll" style={{ position: 'relative', zIndex: 1, padding: '4px 16px 84px', overflowY: 'auto', flex: 1, minHeight: 0 }}>
              {tab === 'rutina' && <RutinaTab />}
              {tab === 'cardio' && <CardioTab />}
              {tab === 'progreso' && <ProgresoTab />}
              {tab === 'fisico' && <DianaFisicaTab />}
              {tab === 'comida' && <ComidaTab />}
              {tab === 'extras' && <ExtrasTab />}
            </div>

            <div style={{ position: 'relative', zIndex: 1, flexShrink: 0, background: 'rgba(6,9,19,0.9)', WebkitBackdropFilter: 'blur(12px)', backdropFilter: 'blur(12px)', borderTop: '1px solid rgba(140,170,255,0.2)', display: 'flex', padding: '8px 6px calc(8px + env(safe-area-inset-bottom))' }}>
              {TABS.map((t) => {
                const active = tab === t.id;
                return (
                  <button key={t.id} onClick={() => setActiveTab(t.id)} style={{ flex: 1, minWidth: 0, background: 'transparent', border: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, padding: '6px 2px', cursor: 'pointer', position: 'relative' }}>
                    {active && <span style={{ position: 'absolute', top: -9, width: 28, height: 3, borderRadius: 3, background: T.grad, boxShadow: '0 0 12px rgba(34,211,238,0.9)' }} />}
                    <span style={{ fontSize: 20, opacity: active ? 1 : 0.5, filter: active ? 'drop-shadow(0 0 8px rgba(34,211,238,0.7))' : 'none', transform: active ? 'scale(1.12)' : 'none', transition: 'all .15s' }}>{t.emoji}</span>
                    <span className="font-body" style={{ fontSize: 10.5, fontWeight: 700, color: active ? '#FFFFFF' : '#6F7A96' }}>{t.label}</span>
                  </button>
                );
              })}
            </div>
          </>
        )}
      </div>
    </GymContext.Provider>
  );
}

window.__GymApp = App;

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

</script>
