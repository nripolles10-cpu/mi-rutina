# SOLO SE USA UNA VEZ. Crea la llave de firma de la app (con contraseña aleatoria) y la deja
# para descargar durante 1 día. Después hay que guardarla en sitio seguro y copiarla a los Secrets.
# Si ya hay una llave en los Secrets, se niega a crear otra (cambiar de llave obliga a desinstalar
# la app y se perderían los datos).
name: Crear llave de firma (solo una vez)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe CREAR para confirmar'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  llave:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Comprobaciones
        env:
          YA_HAY: ${{ secrets.MIRUTINA_KEYSTORE_BASE64 }}
          CONFIRMAR: ${{ github.event.inputs.confirmar }}
        run: |
          if [ "$CONFIRMAR" != "CREAR" ]; then
            echo "::error::Para crear la llave escribe CREAR en la casilla al lanzar el flujo."; exit 1
          fi
          if [ -n "$YA_HAY" ]; then
            echo "::error::Ya hay una llave en los Secrets (MIRUTINA_KEYSTORE_BASE64). No se crea otra: cambiar de llave obliga a desinstalar la app y perder los datos."; exit 1
          fi

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Crear la llave
        run: |
          set -e
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$PASS"
          mkdir -p llave
          keytool -genkeypair -v -storetype PKCS12 -keystore llave/mirutina.jks -alias mirutina \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Mi Rutina, OU=Mi Rutina, O=Mi Rutina, C=ES" > /dev/null 2>&1
          base64 -w 0 llave/mirutina.jks > llave/MIRUTINA_KEYSTORE_BASE64.txt
          HUELLA=$(keytool -list -v -keystore llave/mirutina.jks -storepass "$PASS" | grep -m1 "SHA256" | sed 's/.*SHA256: //')
          {
            echo "LLAVE DE FIRMA DE MI RUTINA — GUÁRDALO EN UN SITIO SEGURO (y en una copia aparte)"
            echo "================================================================================"
            echo ""
            echo "Crea estos 4 Secrets en GitHub (Settings → Secrets and variables → Actions → New repository secret):"
            echo ""
            echo "  Nombre: MIRUTINA_KEYSTORE_BASE64   Valor: todo el contenido del archivo MIRUTINA_KEYSTORE_BASE64.txt"
            echo "  Nombre: MIRUTINA_KEYSTORE_PASSWORD Valor: $PASS"
            echo "  Nombre: MIRUTINA_KEY_ALIAS         Valor: mirutina"
            echo "  Nombre: MIRUTINA_KEY_PASSWORD      Valor: $PASS"
            echo ""
            echo "Huella SHA-256 de la llave (la verás también en cada compilación):"
            echo "  $HUELLA"
            echo ""
            echo "IMPORTANTE: si pierdes la llave (mirutina.jks + la contraseña) no podrás actualizar la app"
            echo "instalada: habría que desinstalarla y se perderían los datos que no tengas en una copia."
            echo "Después de guardarlo todo, borra esta ejecución en la pestaña Actions (menú ··· → Delete workflow run)."
          } > llave/LEEME-DATOS-DE-LA-LLAVE.txt
          echo "Llave creada. Huella SHA-256: $HUELLA"

      - name: Dejar la llave para descargar (1 día)
        uses: actions/upload-artifact@v5
        with:
          name: llave-mi-rutina-DESCARGAR-Y-GUARDAR
          path: llave/
          retention-days: 1
          if-no-files-found: error
