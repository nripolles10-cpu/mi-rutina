# Compila el APK de Mi Rutina cada vez que se sube algo a "main" (o a mano desde la pestaña Actions).
# Resultado: un archivo "mi-rutina" en la parte de abajo de la ejecución, con el APK dentro.
name: PRUEBA TEMPORAL firma (se borrará)

on:
  push:
    branches: [prueba-firma-temporal]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Pruebas y APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hace falta el historial completo para el número de versión

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (ESLint)
        run: npm run lint

      - name: Pruebas automáticas
        run: npm test

      - name: Construir la web
        run: npm run build

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Número de versión
        run: |
          N=$(git rev-list --count HEAD)
          echo "MIRUTINA_VERSION_CODE=$N" >> "$GITHUB_ENV"
          echo "Versión 1.$N (código $N)"

      - name: Comprobar que sin llave la release se para
        working-directory: android
        run: |
          if ./gradlew assembleRelease --no-daemon > ../sin-llave.log 2>&1; then echo "::error::La release se generó sin llave"; exit 1; fi
          grep -q "FALTA LA LLAVE DE FIRMA" ../sin-llave.log && echo "OK: se para con el mensaje claro"

      - name: Llave desechable (mismos comandos que crear-llave.yml)
        run: |
          set -e
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$PASS"
          mkdir -p llave
          keytool -genkeypair -v -storetype PKCS12 -keystore llave/mirutina.jks -alias mirutina \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Mi Rutina, OU=Mi Rutina, O=Mi Rutina, C=ES" > /dev/null 2>&1
          base64 -w 0 llave/mirutina.jks > llave/MIRUTINA_KEYSTORE_BASE64.txt
          keytool -list -v -keystore llave/mirutina.jks -storepass "$PASS" | grep -m1 "SHA256"
          KS=$(cat llave/MIRUTINA_KEYSTORE_BASE64.txt)
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/mirutina.jks"
          cmp llave/mirutina.jks "$RUNNER_TEMP/mirutina.jks" && echo "OK: base64 ida y vuelta"
          echo "MIRUTINA_KEYSTORE_PATH=$RUNNER_TEMP/mirutina.jks" >> "$GITHUB_ENV"
          echo "MIRUTINA_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "MIRUTINA_KEY_ALIAS=mirutina" >> "$GITHUB_ENV"
          echo "MIRUTINA_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          rm -rf llave

      - name: Compilar el APK firmado
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Comprobar la firma y preparar el archivo
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --verbose "$APK"
          echo "Huella de la llave (debe ser SIEMPRE la misma en todas las versiones):"
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
          mkdir -p salida
          cp "$APK" "salida/mi-rutina-1.${MIRUTINA_VERSION_CODE}.apk"
          ls -la salida

      - name: Permisos y datos del APK (sin subirlo)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/aapt2" dump badging salida/*.apk | grep -E "package:|uses-permission|sdkVersion|application-label:|launchable"
          "$BT/aapt2" dump xmltree salida/*.apk --file AndroidManifest.xml | grep -E -A2 "uses-permission|screenOrientation|windowSoftInputMode" | grep -E "name|maxSdk|screenOrientation|windowSoftInputMode" 
          ls -la salida

      - name: Borrar la llave del servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/mirutina.jks"
